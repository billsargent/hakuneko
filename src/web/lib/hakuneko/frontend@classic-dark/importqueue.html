<link rel="import" href="../../polymer/polymer-element.html">
<link rel="import" href="../../polymer/lib/elements/dom-repeat.html">
<link rel="import" href="../../polymer/lib/elements/dom-if.html">
<link rel="import" href="theme.html">

<dom-module id="hakuneko-import-queue">

    <template>
        <style include="theme"></style>
        <style>
            :host {
                display: block;
                background-color: var(--job-control-background-color);
                border-top: var(--manga-control-separator);
                border-bottom: var(--manga-control-separator);
            }
            .header {
                display: flex;
                flex-direction: row;
                padding: 0.25em;
                font-weight: bold;
            }
            .header-title {
                flex: 1;
                padding: 0.25em;
            }
            .header-close {
                flex: 0;
                cursor: pointer;
                padding: 0.25em;
            }
            .header-close:hover {
                opacity: 0.7;
            }
            .phase-badge { font-size: 0.75em; padding: 0.1em 0.4em; border-radius: 0.3em; margin-left: 0.5em; }
            .phase-resolve { background-color: var(--job-list-button-downloading-color); color: #fff; }
            .phase-download { background-color: var(--job-list-button-completed-color); color: #fff; }
            .phase-done { background-color: var(--job-list-button-completed-color); color: #fff; }
            .progress-bar {
                height: 0.5em;
                background-color: var(--job-list-progress-background-color);
                margin: 0.25em;
                border-radius: 0.25em;
            }
            .progress-fill {
                height: 100%;
                background-color: var(--job-list-progress-color);
                transition: width 0.3s ease;
                border-radius: 0.25em;
            }
            .section-title {
                font-size: 0.8em;
                font-weight: bold;
                padding: 0.2em 0.4em;
                background-color: var(--manga-list-notification-color);
            }
            .controls {
                display: flex;
                flex-direction: row;
                padding: 0.25em;
                align-items: center;
                flex-wrap: wrap;
                gap: 0.5em;
            }
            .controls .button {
                cursor: pointer;
                padding: 0.2em 0.5em;
                font-size: 0.9em;
            }
            .controls .button.primary {
                font-weight: bold;
                background-color: var(--job-list-button-downloading-color);
                color: #fff;
                border: none;
                border-radius: 0.2em;
            }
            .controls label {
                font-size: 0.8em;
                display: flex;
                align-items: center;
                gap: 0.25em;
            }
            .controls select {
                font-size: 0.85em;
                padding: 0.1em;
            }
            .status-text {
                flex: 1;
                font-size: 0.85em;
                padding: 0.25em;
                text-align: left;
            }
            .url-list {
                max-height: 10em;
                overflow-y: auto;
                background-color: var(--job-list-background-color);
                font-size: 0.8em;
            }
            .url-item {
                display: flex;
                flex-direction: row;
                padding: 0.15em 0.25em;
                border-bottom: var(--job-list-row-border);
                cursor: default;
            }
            .url-item:hover {
                background-color: var(--manga-list-highlighted);
            }
            .url-item-failed {
                cursor: pointer;
            }
            .url-status-icon {
                flex: 0;
                width: 1.5em;
                text-align: center;
            }
            .url-text {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                padding-left: 0.25em;
            }
            .url-status-text {
                flex: 0;
                width: 5em;
                text-align: right;
                font-size: 0.9em;
            }
            .url-error {
                background-color: var(--manga-list-notification-color);
                padding: 0.5em;
                font-size: 0.9em;
                border-bottom: var(--job-list-row-border);
                white-space: pre-wrap;
                word-break: break-all;
                line-height: 1.4;
            }
            .url-chapters {
                background-color: var(--manga-list-notification-color);
                padding: 0.3em 0.5em;
                font-size: 0.85em;
                border-bottom: var(--job-list-row-border);
            }
            .url-chapters summary { cursor: pointer; }
            .chapter-item {
                display: flex; flex-direction: row; padding: 0.1em 0; font-size: 0.9em;
            }
            .chapter-icon { flex: 0; width: 1.5em; text-align: center; }
            .chapter-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .status-pending,      .status-pending-text      { color: var(--job-list-button-queued-color); }
            .status-resolving,    .status-resolving-text    { color: var(--job-list-button-downloading-color); }
            .status-resolved,     .status-resolved-text     { color: var(--job-list-button-completed-color); }
            .status-failed,       .status-failed-text       { color: var(--job-list-button-failed-color); }
            .status-downloading,  .status-downloading-text  { color: var(--job-list-button-downloading-color); }
            .status-downloaded,   .status-downloaded-text   { color: var(--job-list-button-completed-color); }
            .button-disabled { opacity: 0.5; cursor: not-allowed !important; }
            .empty-message {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 1.5em;
                opacity: 0.6;
                font-size: 0.9em;
            }
            .hide { display: none; }
        </style>

        <div class$="[[ _getVisibilityClass(_visible) ]]">

            <div class="header">
                <span class="header-title">Import Queue Manager <span class$="phase-badge [[ _phaseClass ]]">[[ _phaseLabel ]]</span></span>
                <span class="header-close" on-click="_onCloseClick" title="Close import queue">✕</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" style$="width: [[ _progressPercent ]]%"></div>
            </div>

            <div class="section-title">[[ _phaseSubtext ]]</div>

            <div class="controls">
                <span class="status-text">[[ _statusText ]]</span>

                <!-- Phase 1: Resolve URLs -->
                <template is="dom-if" if="[[ _showResolveStart ]]">
                    <button class="button primary" on-click="_onStartClick">▶ Resolve URLs</button>
                </template>
                <template is="dom-if" if="[[ _showResolveResume ]]">
                    <button class="button primary" on-click="_onResumeClick">⟳ Resume Resolving</button>
                </template>
                <template is="dom-if" if="[[ _isResolving ]]">
                    <button class="button" on-click="_onPauseClick">⏸ Pause</button>
                </template>

                <!-- Phase 2: Download -->
                <template is="dom-if" if="[[ _showDownloadStart ]]">
                    <button class="button primary" on-click="_onDownloadStartClick">▶ Start Downloads</button>
                </template>
                <template is="dom-if" if="[[ _showDownloadResume ]]">
                    <button class="button primary" on-click="_onDownloadResumeClick">⟳ Resume Downloads</button>
                </template>
                <template is="dom-if" if="[[ _isDownloading ]]">
                    <button class="button" on-click="_onPauseClick">⏸ Pause</button>
                </template>

                <!-- Universal -->
                <button class="button" on-click="_onResetClick" disabled$="[[ _processing ]]">🔄 Reset</button>
                <template is="dom-if" if="[[ _showImportButton ]]">
                    <button class="button" on-click="openFilePicker">📂 Import File</button>
                </template>

                <label>Concurrency:
                    <select value="{{ _concurrency::change }}">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="5" selected>5</option>
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                    </select>
                </label>

                <label>Delay:
                    <select value="{{ _batchDelay::change }}">
                        <option value="0">0ms</option>
                        <option value="250">250ms</option>
                        <option value="500" selected>500ms</option>
                        <option value="1000">1s</option>
                        <option value="2000">2s</option>
                        <option value="5000">5s</option>
                    </select>
                </label>

                <label>Page Concurrency:
                    <select value="{{ _pageConcurrency::change }}">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                </label>

                <label>Show list:
                    <input type="checkbox" checked="{{ _showList::change }}">
                </label>
            </div>

            <template is="dom-if" if="[[ _showList ]]">
            <div class="url-list">
                <template is="dom-repeat" items="[[ _urls ]]">
                    <div>
                        <div class$="url-item [[ _getUrlItemClass(item.status) ]]" on-click="_onUrlClick">
                            <span class="url-status-icon">
                                <i class$="fas [[ _getUrlStatusIcon(item.status) ]] [[ _getUrlStatusClass(item.status) ]]"></i>
                            </span>
                            <span class="url-text" title$="[[ item.url ]]">[[ item.url ]]</span>
                            <span class="url-status-text [[ _getUrlStatusClass(item.status) ]]">[[ item.status ]]</span>
                        </div>
                        <div class$="url-error [[ _getErrorVisibility(item, _expandedUrl) ]]">
                            <strong>Error Details:</strong><br>
                            [[ item.error ]]
                        </div>
                        <div class$="url-chapters [[ _getChaptersVisibility(item) ]]">
                            <details>
                                <summary>Chapters ([[ _getChaptersDone(item, _chaptersVersion) ]] / [[ _getChaptersTotal(item, _chaptersVersion) ]])</summary>
                                <template is="dom-repeat" items="[[ item.chapters ]]" initial-count="100">
                                    <div class="chapter-item">
                                        <span class="chapter-icon"><i class$="fas [[ _getChapterIcon(item.status) ]] [[ _getUrlStatusClass(item.status) ]]"></i></span>
                                        <span class="chapter-title">[[ item.title ]]</span>
                                    </div>
                                </template>
                            </details>
                        </div>
                    </div>
                </template>
                <template is="dom-if" if="[[ _showEmptyMessage ]]">
                    <div class="empty-message">
                        Click <strong>Import File</strong> to load URLs, or check for a saved/paused queue on app start.
                    </div>
                </template>
            </div>
            </template>

        </div>
    </template>

    <script>
        /** @polymerElement */
        class HakunekoImportQueue extends Polymer.Element {

            static get is() {
                return 'hakuneko-import-queue';
            }

            static get properties() {
                return {
                    _visible: { type: Boolean, value: false },
                    _urls: { type: Array, value: function() { return []; } },
                    // Phase tracking
                    _phase: { type: String, value: 'idle' }, // idle | resolving | resolve-paused | resolve-done | downloading | download-paused | done
                    _isResolving: { type: Boolean, computed: '_computeIsResolving(_phase)' },
                    _isDownloading: { type: Boolean, computed: '_computeIsDownloading(_phase)' },
                    _isRunning: { type: Boolean, computed: '_computeIsRunning(_phase)' },
                    _processing: { type: Boolean, value: false },
                    // Computed UI flags
                    _showResolveStart: { type: Boolean, computed: '_computeShowResolveStart(_phase, _urls.length, _processing)' },
                    _showResolveResume: { type: Boolean, computed: '_computeShowResolveResume(_phase, _processing)' },
                    _showDownloadStart: { type: Boolean, computed: '_computeShowDownloadStart(_phase, _processing)' },
                    _showDownloadResume: { type: Boolean, computed: '_computeShowDownloadResume(_phase, _processing)' },
                    _showImportButton: { type: Boolean, computed: '_computeShowImportButton(_phase, _processing)' },
                    _showEmptyMessage: { type: Boolean, computed: '_computeEmptyMessage(_urls.length, _visible)' },
                    _phaseLabel: { type: String, computed: '_computePhaseLabel(_phase)' },
                    _phaseClass: { type: String, computed: '_computePhaseClass(_phase)' },
                    _phaseSubtext: { type: String, computed: '_computePhaseSubtext(_phase)' },
                    // Settings
                    _concurrency: { type: Number, value: 5 },
                    _batchDelay: { type: Number, value: 500 },
                    _progressPercent: { type: Number, value: 0 },
                    _statusText: { type: String, value: 'Ready' },
                    _expandedUrl: { type: String, value: null },
                    _processedIndex: { type: Number, value: 0 },
                    _resolvedMangas: { type: Array, value: function() { return []; } },
                    // Download tracking
                    _downloadMangaIndex: { type: Number, value: 0 },
                    _downloadChapterIndex: { type: Number, value: 0 },
                    _currentDownloadingManga: { type: String, value: '' },
                    _currentDownloadingChapter: { type: String, value: '' },
                    _chaptersVersion: { type: Number, value: 0 },
                    // Page-level download concurrency (default 10 for fast connections)
                    _pageConcurrency: { type: Number, value: 10 },
                    // Show/hide the URL list (off by default during download to reduce DOM churn)
                    _showList: { type: Boolean, value: false }
                };
            }

            ready() {
                super.ready();
                this._electron = require('electron');
                this.ipc = require('electron').ipcRenderer;
                this._checkSavedState();
            }

            // ---- Computed Properties ----

            _computeIsResolving(phase) { return phase === 'resolving'; }
            _computeIsDownloading(phase) { return phase === 'downloading'; }
            _computeIsRunning(phase) { return phase === 'resolving' || phase === 'downloading'; }
            _computeShowResolveStart(phase, urlCount, processing) { return phase === 'idle' && urlCount > 0 && !processing; }
            _computeShowResolveResume(phase, processing) { return phase === 'resolve-paused' && !processing; }
            _computeShowDownloadStart(phase, processing) { return phase === 'resolve-done' && !processing; }
            _computeShowDownloadResume(phase, processing) { return phase === 'download-paused' && !processing; }
            _computeShowImportButton(phase, processing) { return phase === 'idle' || phase === 'resolve-done'; }
            _computeEmptyMessage(urlCount, visible) { return visible && urlCount === 0; }

            _computePhaseLabel(phase) {
                switch(phase) {
                    case 'resolving': case 'resolve-paused': return 'Resolving URLs';
                    case 'resolve-done': return 'URLs Resolved';
                    case 'downloading': case 'download-paused': return 'Downloading Chapters';
                    case 'done': return 'Complete';
                    default: return 'Idle';
                }
            }
            _computePhaseClass(phase) {
                switch(phase) {
                    case 'resolving': case 'resolve-paused': return 'phase-resolve';
                    case 'downloading': case 'download-paused': case 'resolve-done': return 'phase-download';
                    case 'done': return 'phase-done';
                    default: return '';
                }
            }
            _computePhaseSubtext(phase) {
                switch(phase) {
                    case 'idle': return 'Import a file to begin.';
                    case 'resolve-done': return 'All URLs resolved. Click Start Downloads to begin downloading chapters.';
                    case 'done': return 'All chapters downloaded.';
                    default: return '';
                }
            }

            // ---- Visibility ----

            _getVisibilityClass(visible) { return visible ? '' : 'hide'; }
            get visible() { return this._visible; }

            // ---- Terminal Logging ----
            _log(message) {
                try { this.ipc.send('import-log', message); }
                catch(e) { console.log(message); }
            }

            // ---- Saved State ----

            _checkSavedState() {
                let self = this;
                self._log('[IMPORT] Checking for saved/paused queue state...');
                Engine.Storage.loadConfig('importqueue')
                    .then(function(data) {
                        if (!data || !data.urls || !data.urls.length) {
                            self._log('[IMPORT] No saved queue state found');
                            return;
                        }
                        self._log('[IMPORT] Found saved queue: phase=' + data.phase + ', ' + data.urls.length + ' URLs');
                        self.set('_urls', data.urls);
                        self.set('_concurrency', data.concurrency || 5);
                        self.set('_batchDelay', data.batchDelay || 500);
                        self.set('_pageConcurrency', data.pageConcurrency || 3);
                        // Normalize active phases to paused equivalents on restore
                        // (app was closed mid-download without explicit pause)
                        let restorePhase = data.phase || 'resolve-paused';
                        if (restorePhase === 'downloading') restorePhase = 'download-paused';
                        if (restorePhase === 'resolving') restorePhase = 'resolve-paused';
                        self.set('_phase', restorePhase);
                        self.set('_processedIndex', data.lastProcessedIndex || 0);
                        self.set('_downloadMangaIndex', data.downloadMangaIndex || 0);
                        self.set('_downloadChapterIndex', data.downloadChapterIndex || 0);
                        self.set('_resolvedMangas', []);
                        // Recalculate progress (use the normalized restorePhase)
                        if (restorePhase === 'resolve-paused' || restorePhase === 'idle') {
                            let pct = Math.round((data.lastProcessedIndex / data.urls.length) * 100) || 0;
                            self.set('_progressPercent', pct);
                            self.set('_statusText', 'Paused at ' + data.lastProcessedIndex + '/' + data.urls.length + ' URLs');
                        } else if (restorePhase === 'download-paused' || restorePhase === 'resolve-done') {
                            self.set('_progressPercent', data.downloadProgressPercent || 50);
                            self.set('_statusText', 'Restoring manga objects from saved state...');
                            // Reconstruct manga objects from stored metadata (instant, no network)
                            self._reconstructMangasFromMeta();
                            return;
                        }
                        self.set('_visible', true);
                    })
                    .catch(function() {});
            }

            async _reconstructMangasFromMeta() {
                let self = this;
                let urls = this._urls;
                let count = 0;
                this._log('[IMPORT] Reconstructing manga objects from stored metadata...');
                
                // Dynamic import of Manga class (ES module, works in Electron renderer)
                let Manga;
                try {
                    let module = await import('../../../mjs/engine/Manga.mjs');
                    Manga = module.default;
                } catch(e) {
                    this._log('[IMPORT] Failed to import Manga class: ' + e.message);
                    this.set('_statusText', 'Error restoring queue state');
                    this.set('_visible', true);
                    return;
                }
                
                for (let i = 0; i < urls.length; i++) {
                    let urlItem = urls[i];
                    if (urlItem.status === 'resolved' && urlItem.mangaMeta) {
                        let meta = urlItem.mangaMeta;
                        let connector = Engine.Connectors.find(function(c) { return c.id === meta.connectorId; });
                        if (connector) {
                            let manga = new Manga(connector, meta.mangaId, meta.mangaTitle);
                            self.set('_urls.' + i + '.manga', manga);
                            self.push('_resolvedMangas', manga);
                            count++;
                        } else {
                            self._log('[IMPORT] Connector not found: ' + meta.connectorId);
                            self.set('_urls.' + i + '.status', 'failed');
                            self.set('_urls.' + i + '.error', 'Connector not available: ' + meta.connectorId);
                        }
                    }
                }
                
                this._log('[IMPORT] Reconstructed ' + count + ' manga objects (instant)');
                this.set('_statusText', 'Queue restored. ' + count + ' manga ready.');
                this.set('_visible', true);
            }

            _saveState() {
                try {
                    let self = this;
                    let urls = self._urls.map(function(u) {
                        return {
                            url: u.url,
                            status: u.status,
                            manga: null,
                            mangaMeta: u.mangaMeta || null,
                            error: u.error instanceof Error ? u.error.message : u.error,
                            chapters: u.chapters || null
                        };
                    });
                    let state = {
                        phase: self._phase,
                        urls: urls,
                        concurrency: self._concurrency,
                        batchDelay: self._batchDelay,
                        pageConcurrency: self._pageConcurrency,
                        lastProcessedIndex: self._processedIndex,
                        downloadMangaIndex: self._downloadMangaIndex,
                        downloadChapterIndex: self._downloadChapterIndex,
                        downloadProgressPercent: self._progressPercent,
                        resolvedMangas: self._resolvedMangas.map(function(m) { return m ? { id: m.id } : null; })
                    };
                    Engine.Storage.saveConfig('importqueue', state, 2)
                        .then(function() { self._log('[IMPORT] State saved (phase=' + state.phase + ')'); })
                        .catch(function(error) { self._log('[IMPORT] State save failed: ' + error.message); });
                } catch (error) {
                    console.error('[IMPORT] Fatal error in _saveState:', error);
                }
            }

            _clearSavedState() {
                this._log('[IMPORT] Clearing saved queue state');
                let state = { urls: [], phase: 'idle' };
                Engine.Storage.saveConfig('importqueue', state, 2).catch(function() {});
            }

            // ---- UI Helpers ----

            _getUrlStatusIcon(status) {
                switch(status) {
                    case 'pending':  return 'fa-clock';
                    case 'resolving': return 'fa-spinner fa-pulse';
                    case 'resolved':  return 'fa-check';
                    case 'failed':    return 'fa-exclamation-triangle';
                    default:          return 'fa-circle';
                }
            }
            _getUrlStatusClass(status) {
                switch(status) {
                    case 'pending':   return 'status-pending';
                    case 'resolving': return 'status-resolving';
                    case 'resolved':  return 'status-resolved';
                    case 'failed':    return 'status-failed';
                    default:          return '';
                }
            }
            _getUrlItemClass(status) {
                return status === 'failed' ? 'url-item url-item-failed' : 'url-item';
            }
            _getErrorVisibility(item, expandedUrl) {
                return (item.status === 'failed' && item.error && item.url === expandedUrl) ? '' : 'hide';
            }
            _getChaptersVisibility(item) {
                return (item.status === 'resolved' && item.chapters && item.chapters.length > 0) ? '' : 'hide';
            }
            _getChaptersDone(item) {
                if (!item.chapters) return 0;
                return item.chapters.filter(function(c) { return c.status === 'downloaded'; }).length;
            }
            _getChaptersTotal(item) {
                return item.chapters ? item.chapters.length : 0;
            }
            _getChapterIcon(status) {
                switch(status) {
                    case 'pending':     return 'fa-circle';
                    case 'downloading': return 'fa-spinner fa-pulse';
                    case 'downloaded':  return 'fa-check';
                    case 'failed':      return 'fa-exclamation-triangle';
                    default:            return 'fa-circle';
                }
            }

            _onUrlClick(e) {
                let item = e.model.item;
                if (item.status === 'failed') {
                    this.set('_expandedUrl', this._expandedUrl === item.url ? null : item.url);
                }
            }

            // ---- Public API ----

            showPanel() {
                this.set('_visible', true);
                this.set('_statusText', 'Import Queue Manager');
            }

            async openFilePicker() {
                this._log('[IMPORT] Opening file picker dialog...');
                let result = await this._electron.remote.dialog.showOpenDialog({
                    title: 'Select URL Import File',
                    properties: ['openFile'],
                    filters: [
                        { name: 'Text Files', extensions: ['txt', 'csv', 'urls'] },
                        { name: 'All Files', extensions: ['*'] }
                    ]
                });

                if (result.canceled || !result.filePaths || result.filePaths.length === 0) {
                    this._log('[IMPORT] File picker cancelled');
                    return;
                }
                this._log('[IMPORT] User selected file: ' + result.filePaths[0]);

                this.set('_visible', true);
                this.set('_statusText', 'Reading file...');
                this.set('_expandedUrl', null);
                this.set('_urls', []);
                await new Promise(function(resolve) { setTimeout(resolve, 50); });

                let fs = require('fs');
                let content = fs.readFileSync(result.filePaths[0], 'utf8');
                this._log('[IMPORT] File read: ' + content.length + ' bytes');

                this.set('_statusText', 'Parsing URLs...');
                await new Promise(function(resolve) { setTimeout(resolve, 50); });

                let lines = content.split(/\r?\n/).filter(function(line) { return line.trim().length > 0; });
                this._log('[IMPORT] Found ' + lines.length + ' URLs in file');

                if (lines.length === 0) {
                    alert('The selected file contains no URLs.');
                    this.set('_urls', []);
                    this.set('_statusText', 'Ready');
                    return;
                }

                this.set('_statusText', 'Creating URL objects (' + lines.length + ')...');
                let urlObjects = [];
                for (let i = 0; i < lines.length; i += 500) {
                    let chunk = lines.slice(i, i + 500);
                    for (let j = 0; j < chunk.length; j++) {
                        urlObjects.push({
                            url: chunk[j].trim(),
                            status: 'pending',
                            manga: null,
                            error: null,
                            chapters: null
                        });
                    }
                    if (i % 5000 === 0 && i > 0) {
                        this._log('[IMPORT] Yield at ' + urlObjects.length + ' objects...');
                        await new Promise(function(resolve) { setTimeout(resolve, 10); });
                    }
                }

                this.set('_urls', urlObjects);
                this.set('_processedIndex', 0);
                this.set('_resolvedMangas', []);
                this.set('_progressPercent', 0);
                this.set('_phase', 'idle');
                this.set('_downloadMangaIndex', 0);
                this.set('_downloadChapterIndex', 0);
                this.set('_statusText', 'Loaded ' + lines.length + ' URLs. Click "Resolve URLs" to begin.');
                this._saveState();
            }

            // ---- Event Handlers ----

            _onCloseClick() {
                this._log('[IMPORT] Close button clicked');
                if (this._isRunning) {
                    if (!confirm('Import is in progress. Pause and close?')) return;
                    this._pauseQueue();
                }
                this.set('_visible', false);
                this.set('_expandedUrl', null);
            }

            _onStartClick() {
                this._log('[IMPORT] ▶ Resolve URLs clicked');
                if (this._processing) return;
                this.set('_phase', 'resolving');
                this.set('_expandedUrl', null);
                this._processUrls();
            }

            _onResumeClick() {
                this._log('[IMPORT] ⟳ Resume resolving clicked');
                if (this._processing) return;
                this.set('_phase', 'resolving');
                this.set('_expandedUrl', null);
                this._processUrls();
            }

            _onDownloadStartClick() {
                this._log('[IMPORT] ▶ Start Downloads clicked');
                if (this._processing) return;
                this.set('_phase', 'downloading');
                this.set('_downloadMangaIndex', 0);
                this.set('_downloadChapterIndex', 0);
                this.set('_expandedUrl', null);
                this._processDownloads();
            }

            _onDownloadResumeClick() {
                this._log('[IMPORT] ⟳ Resume Downloads clicked');
                if (this._processing) return;
                this.set('_phase', 'downloading');
                this.set('_expandedUrl', null);
                // Restart the current manga from chapter 0 to avoid skipping
                // (saved _downloadChapterIndex may be stale after pause/resume)
                this.set('_downloadChapterIndex', 0);
                this._processDownloads();
            }

            _onPauseClick() {
                this._pauseQueue();
            }

            _pauseQueue() {
                this._log('[IMPORT] ⏸ Pausing...');
                let pausedPhase = this._phase === 'resolving' ? 'resolve-paused' : 'download-paused';
                this.set('_phase', pausedPhase);
                this.set('_statusText', 'Paused');
                this._saveState();
            }

            _onResetClick() {
                this._log('[IMPORT] 🔄 Reset clicked');
                if (this._isRunning) {
                    if (!confirm('Reset will stop the current import. Are you sure?')) return;
                }
                this.set('_urls', []);
                this.set('_resolvedMangas', []);
                this.set('_progressPercent', 0);
                this.set('_phase', 'idle');
                this.set('_processedIndex', 0);
                this.set('_downloadMangaIndex', 0);
                this.set('_downloadChapterIndex', 0);
                this.set('_statusText', 'Ready');
                this.set('_expandedUrl', null);
                this._clearSavedState();
            }

            // ---- Helper ----

            _countProcessed() {
                let count = 0;
                for (let i = 0; i < this._urls.length; i++) {
                    if (this._urls[i].status === 'resolved' || this._urls[i].status === 'failed') count++;
                }
                return count;
            }

            // ---- Phase 1: URL Resolution ----

            async _processUrls() {
                if (this._processing) return;
                this._processing = true;
                let self = this;
                let urls = this._urls;
                let concurrency = this._concurrency;
                let delay = this._batchDelay;
                let batchCount = 0;

                try {
                    while (this._phase === 'resolving' && this._processedIndex < urls.length) {
                        let batch = [];
                        for (let i = this._processedIndex; i < urls.length && batch.length < concurrency; i++) {
                            if (urls[i].status === 'pending') batch.push({ index: i, urlObj: urls[i] });
                        }
                        if (batch.length === 0) {
                            let allDone = true;
                            for (let i = 0; i < urls.length; i++) {
                                if (urls[i].status === 'pending') { allDone = false; break; }
                            }
                            if (allDone) break;
                            this._processedIndex++;
                            continue;
                        }

                        batchCount++;
                        self._log('[IMPORT] Batch ' + batchCount + ': ' + batch.length + ' URLs');
                        batch.forEach(function(item) { self.set('_urls.' + item.index + '.status', 'resolving'); });

                        // Track each URL's completion individually to update UI per-item
                        let pendingCount = batch.length;
                        batch.forEach(function(item) {
                            self._resolveUrl(item.index, item.urlObj.url)
                                .catch(function(error) {
                                    self._log('[IMPORT] Error resolving URL (catch): ' + error.message);
                                })
                                .then(function() {
                                    pendingCount--;
                                    let processed = self._countProcessed();
                                    let percent = Math.round((processed / urls.length) * 100);
                                    self.set('_progressPercent', percent);
                                    self.set('_statusText', 'Resolved ' + processed + '/' + urls.length + ' (' + percent + '%)');
                                });
                        });
                        // Wait for all URLs in the batch to finish
                        while (pendingCount > 0) {
                            await new Promise(function(resolve) { setTimeout(resolve, 50); });
                            if (self._phase !== 'resolving') break;
                        }
                        this.set('_processedIndex', this._processedIndex + batch.length);

                        // Periodic save every 5 batches for crash recovery
                        if (batchCount % 5 === 0) { this._saveState(); }

                        if (delay > 0 && this._phase === 'resolving') {
                            await new Promise(function(resolve) { setTimeout(resolve, delay); });
                        }
                    }

                    if (this._phase === 'resolving') {
                        let resolved = 0, failed = 0;
                        for (let i = 0; i < urls.length; i++) {
                            if (urls[i].status === 'resolved') resolved++;
                            else if (urls[i].status === 'failed') failed++;
                        }
                        this._log('[IMPORT] ✓ URLs resolved: ' + resolved + ' OK, ' + failed + ' failed');
                        this.set('_phase', 'resolve-done');
                        this.set('_statusText', resolved + ' resolved, ' + failed + ' failed. Ready to download.');
                        this.set('_progressPercent', 100);
                        this._saveState();
                    }
                } catch (error) {
                    this._log('[IMPORT] Error: ' + error.message);
                    this.set('_phase', 'resolve-paused');
                    this._saveState();
                } finally {
                    this._processing = false;
                }
            }

            async _resolveUrl(index, url) {
                try {
                    let uri = new URL(url);
                    let connectors = Engine.Connectors.filter(function(c) { return c.canHandleURI && c.canHandleURI(uri); });
                    if (!connectors.length) {
                        connectors = Engine.Connectors.filter(function(c) { return c.url && c.url.includes(uri.hostname); });
                    }
                    if (connectors.length > 1) {
                        let pathname = uri.pathname;
                        connectors = connectors.filter(function(c) { return pathname.startsWith(new URL(c.url).pathname); });
                    }
                    if (!connectors.length) throw new Error('No matching connector found for ' + uri.href);
                    if (connectors.length > 1) throw new Error('Too many connectors for ' + uri.href);

                    let manga = await connectors[0].getMangaFromURI(uri);
                    this.set('_urls.' + index + '.status', 'resolved');
                    // Store metadata for crash-safe resume (JSON-safe, no functions)
                    this.set('_urls.' + index + '.mangaMeta', {
                        connectorId: connectors[0].id,
                        mangaId: manga.id,
                        mangaTitle: manga.title
                    });
                    // Do NOT store the full Manga object - mangaMeta is sufficient for reconstruction
                    // Keeping Manga objects for all ~14K resolved URLs causes massive memory growth
                } catch (error) {
                    this._log('[IMPORT] ✗ ' + url + ' → ' + error.message);
                    this.set('_urls.' + index + '.status', 'failed');
                    this.set('_urls.' + index + '.error', error.message);
                }
            }

            // ---- Phase 2: Chapter Downloads (using DownloadJob's internal mechanism) ----

            async _processDownloads() {
                if (this._processing) return;
                this._processing = true;
                let self = this;
                let delay = this._batchDelay;

                // Reconstruct manga objects from stored metadata (mangaMeta was saved during URL resolution)
                // Manga objects are NOT kept in memory during resolution to conserve RAM,
                // so we rebuild them here on-demand for the download phase
                await this._reconstructMangasFromMeta();

                // Get unique resolved manga
                let mangas = [];
                let seenIds = {};
                let urls = this._urls;
                for (let i = 0; i < urls.length; i++) {
                    if (urls[i].status === 'resolved' && urls[i].manga && !seenIds[urls[i].manga.id]) {
                        seenIds[urls[i].manga.id] = true;
                        mangas.push(urls[i]);
                    }
                }
                this._log('[IMPORT] Starting downloads for ' + mangas.length + ' unique manga');

                try {
                    for (let m = this._downloadMangaIndex; m < mangas.length && this._phase === 'downloading'; m++) {
                        let urlItem = mangas[m];
                        let manga = urlItem.manga;
                        this._downloadMangaIndex = m;
                        this.set('_currentDownloadingManga', manga.title);
                        this.set('_statusText', 'Fetching chapters for: ' + manga.title + ' (' + (m+1) + '/' + mangas.length + ')');
                        this._log('[IMPORT] Processing manga ' + (m+1) + '/' + mangas.length + ': ' + manga.title);

                        // Fetch chapters
                        let chapters = [];
                        try {
                            chapters = await new Promise(function(resolve, reject) {
                                manga.getChapters(function(error, chs) {
                                    if (error) reject(error); else resolve(chs);
                                });
                            });
                        } catch (error) {
                            this._log('[IMPORT]   └─ Failed to get chapters: ' + error.message);
                            continue;
                        }

                        if (!chapters || chapters.length === 0) {
                            this._log('[IMPORT]   └─ No chapters found');
                            continue;
                        }

                        // Find the urlItem index in _urls to update
                        let urlIdx = this._urls.indexOf(urlItem);

                        // Download each chapter
                        let downloadStartIdx = (m === this._downloadMangaIndex) ? this._downloadChapterIndex : 0;
                        for (let c = downloadStartIdx; c < chapters.length && this._phase === 'downloading'; c++) {
                            let chapter = chapters[c];
                            this._downloadChapterIndex = c;
                            this.set('_currentDownloadingChapter', chapter.title);

                            // Update UI - store chapter info and set status to downloading
                            if (urlIdx >= 0) {
                                if (!this._urls[urlIdx].chapters) {
                                    let chapterItems = chapters.map(function(ch) {
                                        return { title: ch.title, status: 'pending' };
                                    });
                                    this.set('_urls.' + urlIdx + '.chapters', chapterItems);
                                }
                                this.set('_urls.' + urlIdx + '.chapters.' + c + '.status', 'downloading');
                            }

                            let pct = Math.round(((m * chapters.length + c) / (mangas.length * chapters.length)) * 100);
                            this.set('_progressPercent', pct);
                            this.set('_statusText', 'Downloading: ' + manga.title + ' - ' + chapter.title + ' (' + (m+1) + '/' + mangas.length + ' manga)');
                            this._log('[IMPORT]   └─ Downloading: ' + chapter.title);

                            // Use DownloadJob approach: getPages → save
                            let success = await this._downloadChapter(chapter);

                            if (urlIdx >= 0) {
                                this.set('_urls.' + urlIdx + '.chapters.' + c + '.status', success ? 'downloaded' : 'failed');
                            }
                            // Bump version to force computed property re-evaluation for chapter counts
                            this.set('_chaptersVersion', this._chaptersVersion + 1);
                            if (success) {
                                this._log('[IMPORT]     ✓ ' + chapter.title + ' saved');
                            } else {
                                this._log('[IMPORT]     ✗ ' + chapter.title + ' failed');
                            }

                            // Save state after each chapter for crash recovery
                            if (c % 5 === 0) { this._saveState(); }

                            if (delay > 0 && this._phase === 'downloading') {
                                await new Promise(function(resolve) { setTimeout(resolve, delay); });
                            }
                        }
                        this._downloadChapterIndex = 0; // Reset for next manga
                    }

                    if (this._phase === 'downloading') {
                        // Count actual results
                        let totalDownloaded = 0;
                        let totalFailed = 0;
                        for (let i = 0; i < urls.length; i++) {
                            if (urls[i].status === 'resolved' && urls[i].chapters) {
                                for (let c = 0; c < urls[i].chapters.length; c++) {
                                    if (urls[i].chapters[c].status === 'downloaded') totalDownloaded++;
                                    if (urls[i].chapters[c].status === 'failed') totalFailed++;
                                }
                            }
                        }
                        this._log('[IMPORT] ✓ Downloads finished: ' + totalDownloaded + ' OK, ' + totalFailed + ' failed');
                        if (totalFailed === 0 && totalDownloaded > 0) {
                            this.set('_phase', 'done');
                            this.set('_statusText', 'All downloads finished! (' + totalDownloaded + ' chapters)');
                            this.set('_progressPercent', 100);
                            this._clearSavedState();
                        } else if (totalDownloaded > 0) {
                            this.set('_phase', 'download-paused');
                            this.set('_statusText', 'Partial: ' + totalDownloaded + ' downloaded, ' + totalFailed + ' failed. Resume to retry.');
                            this._saveState();
                        } else {
                            this.set('_phase', 'resolve-done');
                            this.set('_statusText', 'All downloads failed. Check URLs and try again.');
                            this._saveState();
                        }
                    }
                } catch (error) {
                    this._log('[IMPORT] Download error: ' + error.message);
                    this.set('_statusText', 'Error: ' + error.message);
                    this.set('_phase', 'download-paused');
                } finally {
                    this._processing = false;
                    this._saveState();
                }
            }

            /**
             * Download a single chapter's pages using a worker pool pattern.
             * At most _pageConcurrency page fetches are in-flight at any time.
             * chapter.getPages() → fetch blobs → Engine.Storage.saveChapterPages()
             */
            async _downloadChapter(chapter) {
                try {
                    let pages = await new Promise(function(resolve, reject) {
                        chapter.getPages(function(error, data) {
                            if (error) reject(error);
                            else resolve(data);
                        });
                    });

                    if (!pages || (pages instanceof Array && pages.length === 0)) {
                        throw new Error('No pages found');
                    }

                    // Handle manga pages (array of URLs)
                    if (pages instanceof Array) {
                        let maxConcurrent = this._pageConcurrency || 3;
                        let results = [];
                        let currentIndex = 0;
                        let self = this;
                        let requestOptions = chapter.manga.connector.requestOptions || {};

                        async function worker() {
                            while (currentIndex < pages.length) {
                                let i = currentIndex++;
                                // NOTE: Per-page IPC logging removed for performance
                                // (thousands of IPC.send() calls per chapter overwhelm the Electron bridge)
                                let response = await fetch(pages[i], requestOptions);
                                if (response.status !== 200) {
                                    throw new Error('Page ' + pages[i] + ' returned status ' + response.status);
                                }
                                results[i] = await response.blob();
                            }
                        }

                        let workers = [];
                        for (let w = 0; w < maxConcurrent; w++) {
                            workers.push(worker());
                        }
                        await Promise.all(workers);

                        await Engine.Storage.saveChapterPages(chapter, results);
                        return true;
                    }

                    // Handle anime playlists/streams (not supported in importer)
                    this._log('[IMPORT] Skipping non-image chapter: ' + chapter.title);
                    return false;
                } catch (error) {
                    this._log('[IMPORT] Download failed: ' + error.message);
                    return false;
                }
            }
        }
        window.customElements.define(HakunekoImportQueue.is, HakunekoImportQueue);
    </script>

</dom-module>
