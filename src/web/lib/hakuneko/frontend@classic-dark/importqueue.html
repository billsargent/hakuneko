<link rel="import" href="../../polymer/polymer-element.html">
<link rel="import" href="../../polymer/lib/elements/dom-repeat.html">
<link rel="import" href="../../polymer/lib/elements/dom-if.html">
<link rel="import" href="theme.html">

<dom-module id="hakuneko-import-queue">

    <template>
        <style include="theme"></style>
        <style>
            :host {
                display: block;
                background-color: var(--job-control-background-color);
                border-top: var(--manga-control-separator);
                border-bottom: var(--manga-control-separator);
            }
            .header {
                display: flex;
                flex-direction: row;
                padding: 0.25em;
                font-weight: bold;
            }
            .header-title {
                flex: 1;
                padding: 0.25em;
            }
            .header-close {
                flex: 0;
                cursor: pointer;
                padding: 0.25em;
            }
            .header-close:hover {
                opacity: 0.7;
            }
            .phase-badge { font-size: 0.75em; padding: 0.1em 0.4em; border-radius: 0.3em; margin-left: 0.5em; }
            .phase-resolve { background-color: var(--job-list-button-downloading-color); color: #fff; }
            .phase-download { background-color: var(--job-list-button-completed-color); color: #fff; }
            .phase-done { background-color: var(--job-list-button-completed-color); color: #fff; }
            .progress-bar {
                height: 0.5em;
                background-color: var(--job-list-progress-background-color);
                margin: 0.25em;
                border-radius: 0.25em;
            }
            .progress-fill {
                height: 100%;
                background-color: var(--job-list-progress-color);
                transition: width 0.3s ease;
                border-radius: 0.25em;
            }
            .section-title {
                font-size: 0.8em;
                font-weight: bold;
                padding: 0.2em 0.4em;
                background-color: var(--manga-list-notification-color);
            }
            .controls {
                display: flex;
                flex-direction: row;
                padding: 0.25em;
                align-items: center;
                flex-wrap: wrap;
                gap: 0.5em;
            }
            .controls .button {
                cursor: pointer;
                padding: 0.2em 0.5em;
                font-size: 0.9em;
            }
            .controls .button.primary {
                font-weight: bold;
                background-color: var(--job-list-button-downloading-color);
                color: #fff;
                border: none;
                border-radius: 0.2em;
            }
            .controls label {
                font-size: 0.8em;
                display: flex;
                align-items: center;
                gap: 0.25em;
            }
            .controls select {
                font-size: 0.85em;
                padding: 0.1em;
            }
            .status-text {
                flex: 1;
                font-size: 0.85em;
                padding: 0.25em;
                text-align: left;
            }
            .url-list {
                max-height: 10em;
                overflow-y: auto;
                background-color: var(--job-list-background-color);
                font-size: 0.8em;
            }
            .url-item {
                display: flex;
                flex-direction: row;
                padding: 0.15em 0.25em;
                border-bottom: var(--job-list-row-border);
                cursor: default;
            }
            .url-item:hover {
                background-color: var(--manga-list-highlighted);
            }
            .url-item-failed {
                cursor: pointer;
            }
            .url-status-icon {
                flex: 0;
                width: 1.5em;
                text-align: center;
            }
            .url-text {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                padding-left: 0.25em;
            }
            .url-status-text {
                flex: 0;
                width: 5em;
                text-align: right;
                font-size: 0.9em;
            }
            .url-error {
                background-color: var(--manga-list-notification-color);
                padding: 0.5em;
                font-size: 0.9em;
                border-bottom: var(--job-list-row-border);
                white-space: pre-wrap;
                word-break: break-all;
                line-height: 1.4;
            }
            .url-chapters {
                background-color: var(--manga-list-notification-color);
                padding: 0.3em 0.5em;
                font-size: 0.85em;
                border-bottom: var(--job-list-row-border);
            }
            .url-chapters summary { cursor: pointer; }
            .chapter-item {
                display: flex; flex-direction: row; padding: 0.1em 0; font-size: 0.9em;
            }
            .chapter-icon { flex: 0; width: 1.5em; text-align: center; }
            .chapter-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .status-pending,      .status-pending-text      { color: var(--job-list-button-queued-color); }
            .status-resolving,    .status-resolving-text    { color: var(--job-list-button-downloading-color); }
            .status-resolved,     .status-resolved-text     { color: var(--job-list-button-completed-color); }
            .status-failed,       .status-failed-text       { color: var(--job-list-button-failed-color); }
            .status-downloading,  .status-downloading-text  { color: var(--job-list-button-downloading-color); }
            .status-downloaded,   .status-downloaded-text   { color: var(--job-list-button-completed-color); }
            .button-disabled { opacity: 0.5; cursor: not-allowed !important; }
            .empty-message {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 1.5em;
                opacity: 0.6;
                font-size: 0.9em;
            }
            .hide { display: none; }
        </style>

        <div class$="[[ _getVisibilityClass(_visible) ]]">

            <div class="header">
                <span class="header-title">Import Queue Manager <span class$="phase-badge [[ _phaseClass ]]">[[ _phaseLabel ]]</span></span>
                <span class="header-close" on-click="_onCloseClick" title="Close import queue">✕</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" style$="width: [[ _progressPercent ]]%"></div>
            </div>

            <div class="section-title">[[ _phaseSubtext ]]</div>

            <div class="controls">
                <span class="status-text">[[ _statusText ]]</span>

                <!-- Phase 1: Resolve + Pre-fetch URLs -->
                <template is="dom-if" if="[[ _showResolveStart ]]">
                    <button class="button primary" on-click="_onStartClick">▶ Resolve & Pre-fetch</button>
                </template>
                <template is="dom-if" if="[[ _showResolveResume ]]">
                    <button class="button primary" on-click="_onResumeClick">⟳ Resume Resolving</button>
                </template>
                <template is="dom-if" if="[[ _isResolving ]]">
                    <button class="button" on-click="_onPauseClick">⏸ Pause</button>
                </template>

                <!-- Download pre-fetched manga while paused during resolution -->
                <template is="dom-if" if="[[ _showDownloadResolved ]]">
                    <button class="button primary" on-click="_onDownloadResolvedClick">⬇ Download Pre-fetched</button>
                </template>
                <!-- Resume pre-fetched download after pause -->
                <template is="dom-if" if="[[ _showResumePrefetched ]]">
                    <button class="button primary" on-click="_onResumePrefetchedClick">⟳ Resume Pre-fetched</button>
                </template>

                <!-- Phase 2: Download -->
                <template is="dom-if" if="[[ _showDownloadStart ]]">
                    <button class="button primary" on-click="_onDownloadStartClick">▶ Start Downloads</button>
                </template>
                <template is="dom-if" if="[[ _showDownloadResume ]]">
                    <button class="button primary" on-click="_onDownloadResumeClick">⟳ Resume Downloads</button>
                </template>
                <template is="dom-if" if="[[ _isDownloading ]]">
                    <button class="button" on-click="_onPauseClick">⏸ Pause</button>
                </template>

                <!-- Universal -->
                <button class="button" on-click="_onResetClick" disabled$="[[ _processing ]]">🔄 Reset</button>
                <template is="dom-if" if="[[ _showImportButton ]]">
                    <button class="button" on-click="openFilePicker">📂 Import File</button>
                </template>
                <template is="dom-if" if="[[ _showExportButton ]]">
                    <button class="button" on-click="_onExportClick">&#x1F4E4; Export JSON</button>
                </template>
                <template is="dom-if" if="[[ _showRetryFailed ]]">
                    <button class="button primary" on-click="_onRetryFailedClick" disabled$="[[ _processing ]]">⟳ Retry Failed</button>
                </template>
                <template is="dom-if" if="[[ _showMarkDone ]]">
                    <button class="button primary" on-click="_onMarkDoneClick">✓ Mark Done</button>
                </template>

                <label>Concurrency:
                    <select value="{{ _concurrency::change }}">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="5" selected>5</option>
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                    </select>
                </label>

                <label>Delay:
                    <select value="{{ _batchDelay::change }}">
                        <option value="0">0ms</option>
                        <option value="250">250ms</option>
                        <option value="500" selected>500ms</option>
                        <option value="1000">1s</option>
                        <option value="2000">2s</option>
                        <option value="5000">5s</option>
                    </select>
                </label>

                <label>Chapter Concurrency:
                    <select value="{{ _pageConcurrency::change }}">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                </label>

                <label>Timeout:
                    <select value="{{ _urlTimeout::change }}">
                        <option value="60000">1m</option>
                        <option value="120000">2m</option>
                        <option value="300000">5m</option>
                        <option value="600000" selected>10m</option>
                        <option value="1200000">20m</option>
                        <option value="1800000">30m</option>
                        <option value="2400000">40m</option>
                        <option value="3000000">50m</option>
                        <option value="3600000">60m</option>
                    </select>
                </label>

                <label>Show list:
                    <input type="checkbox" checked="{{ _showList::change }}">
                </label>
            </div>

            <template is="dom-if" if="[[ _showList ]]">
            <div class="url-list">
                <template is="dom-repeat" items="[[ _displayUrls ]]">
                    <div>
                        <div class$="url-item [[ _getUrlItemClass(item.resolveStatus) ]]" on-click="_onUrlClick">
                            <span class="url-status-icon">
                                <i class$="fas [[ _getUrlStatusIcon(item.resolveStatus) ]] [[ _getUrlStatusClass(item.resolveStatus) ]]"></i>
                            </span>
                            <span class="url-text" title$="[[ item.url ]]">[[ item.url ]]</span>
                            <span class="url-status-text [[ _getUrlStatusClass(item.resolveStatus) ]]">[[ item.resolveStatus ]]</span>
                        </div>
                        <div class$="url-error [[ _getErrorVisibility(item, _expandedUrl) ]]">
                            <strong>Error Details:</strong><br>
                            [[ item.resolveError ]]
                        </div>
                        <div class$="url-chapters [[ _getChaptersVisibility(item) ]]">
                            <details>
                                <summary>Chapters ([[ _getChaptersDone(item) ]] / [[ _getChaptersTotal(item) ]])</summary>
                                <template is="dom-repeat" items="[[ item.chapters ]]" initial-count="100">
                                    <div class="chapter-item">
                                        <span class="chapter-icon"><i class$="fas [[ _getChapterIcon(item.downloadStatus) ]] [[ _getUrlStatusClass(item.downloadStatus) ]]"></i></span>
                                        <span class="chapter-title">[[ item.title ]]</span>
                                    </div>
                                </template>
                            </details>
                        </div>
                    </div>
                </template>
                <template is="dom-if" if="[[ _showEmptyMessage ]]">
                    <div class="empty-message">
                        Click <strong>Import File</strong> to load URLs, or check for a saved/paused queue on app start.
                    </div>
                </template>
            </div>
            </template>

        </div>
    </template>

    <script>
        /** @polymerElement */
        class HakunekoImportQueue extends Polymer.Element {

            static get is() {
                return 'hakuneko-import-queue';
            }

            static get properties() {
                return {
                    _visible: { type: Boolean, value: false },
                    // Display-only: a small slice of URL records for the UI list
                    _displayUrls: { type: Array, value: function() { return []; } },
                    // Phase tracking
                    _phase: { type: String, value: 'idle' }, // idle | resolving | resolve-paused | resolve-done | downloading | download-paused | done
                    _isResolving: { type: Boolean, computed: '_computeIsResolving(_phase)' },
                    _isDownloading: { type: Boolean, computed: '_computeIsDownloading(_phase)' },
                    _isRunning: { type: Boolean, computed: '_computeIsRunning(_phase)' },
                    _processing: { type: Boolean, value: false },
                    // Computed UI flags
                    _showResolveStart: { type: Boolean, computed: '_computeShowResolveStart(_phase, _totalUrlCount, _processing)' },
                    _showResolveResume: { type: Boolean, computed: '_computeShowResolveResume(_phase, _downloadResolvedActive)' },
                    _showDownloadStart: { type: Boolean, computed: '_computeShowDownloadStart(_phase, _processing)' },
                    _showDownloadResume: { type: Boolean, computed: '_computeShowDownloadResume(_phase, _downloadResolvedActive)' },
                    _showImportButton: { type: Boolean, computed: '_computeShowImportButton(_phase, _processing)' },
                    _showExportButton: { type: Boolean, computed: '_computeShowExportButton(_phase, _processing, _totalUrlCount)' },
                    _showRetryFailed: { type: Boolean, computed: '_computeShowRetryFailed(_phase, _processing, _totalUrlCount)' },
                    _showEmptyMessage: { type: Boolean, computed: '_computeEmptyMessage(_totalUrlCount, _visible)' },
                    _showDownloadResolved: { type: Boolean, computed: '_computeShowDownloadResolved(_phase, _downloadResolvedActive)' },
                    _downloadResolvedActive: { type: Boolean, value: false },
                    _showResumePrefetched: { type: Boolean, computed: '_computeShowResumePrefetched(_phase, _downloadResolvedActive)' },
                    _showMarkDone: { type: Boolean, computed: '_computeShowMarkDone(_phase, _downloadResolvedActive)' },
                    _phaseLabel: { type: String, computed: '_computePhaseLabel(_phase)' },
                    _phaseClass: { type: String, computed: '_computePhaseClass(_phase)' },
                    _phaseSubtext: { type: String, computed: '_computePhaseSubtext(_phase)' },
                    // Settings (Polymer-tracked for UI bindings)
                    _concurrency: { type: Number, value: 5 },
                    _batchDelay: { type: Number, value: 500 },
                    _pageConcurrency: { type: Number, value: 10 },
                    _urlTimeout: { type: Number, value: 600000 },
                    _progressPercent: { type: Number, value: 0 },
                    _statusText: { type: String, value: 'Ready' },
                    _totalUrlCount: { type: Number, value: 0 },
                    _expandedUrl: { type: String, value: null },
                    // Show/hide the URL list
                    _showList: { type: Boolean, value: false }
                };
            }

            constructor() {
                super();
                // Internal plain-JS data (NOT Polymer-tracked) for performance
                this._urlRecords = [];           // Array of URL data objects
                this._processedIndex = 0;        // For resolution tracking
                this._downloadMangaIndex = 0;    // For download tracking
                // Cache for page URLs, keyed by 'url::chapterId'.
                // Kept outside Polymer's observable system to avoid IPC serialization bloat.
                this._pageUrlCache = new Map();
                // Track active AbortControllers for in-flight fetch() calls during download phase
                this._abortControllers = [];
                // Throttle for _refreshDisplayUrls to prevent Polymer re-render storms
                this._lastRefreshTime = 0;
                // Flag to defer _clearSavedState (set by _onDownloadResolvedClick to avoid wiping unresolved records)
                this._deferClearState = false;
            }


            async ready() {
                super.ready();
                this._electron = require('electron');
                this.ipc = require('electron').ipcRenderer;
                // Dynamic import of Manga class (ES module)
                try {
                    let module = await import('../../../mjs/engine/Manga.mjs');
                    this._MangaClass = module.default;
                } catch(e) {
                    this._log('[IMPORT] Failed to import Manga class: ' + e.message);
                }
                // Dynamic import of Chapter class
                try {
                    let module = await import('../../../mjs/engine/Chapter.mjs');
                    this._ChapterClass = module.default;
                } catch(e) {
                    this._log('[IMPORT] Failed to import Chapter class: ' + e.message);
                }
                await this._initDB();
                await this._checkSavedState();
            }

            // ---- Database Initialization ----

            async _initDB() {
                try {
                    let module = await import('../../../mjs/engine/ImportQueueDB.mjs');
                    this._db = new module.default();
                    await this._db.open();
                    this._log('[IMPORT] IndexedDB initialized');
                } catch(e) {
                    this._log('[IMPORT] Failed to init IndexedDB: ' + e.message);
                    this._db = null;
                }
            }

            encodeURIComponent(uri) {
                // Use base64 encode of the URI as the key to avoid IDB key path issues with long/weird URLs
                if (typeof btoa !== 'undefined') {
                    try {
                        return btoa(uri).replace(/[=+\/]/g, function(c) {
                            if (c === '=') return '';
                            if (c === '+') return '-';
                            if (c === '/') return '_';
                            return c;
                        });
                    } catch(e) {
                        return uri;
                    }
                }
                return uri;
            }

            // ---- Computed Properties ----

            _computeIsResolving(phase) { return phase === 'resolving'; }
            _computeIsDownloading(phase) { return phase === 'downloading'; }
            _computeIsRunning(phase) { return phase === 'resolving' || phase === 'downloading'; }
            _computeShowResolveStart(phase, urlCount, processing) { return phase === 'idle' && urlCount > 0 && !processing; }
            _computeShowResolveResume(phase, downloadResolvedActive) { return phase === 'resolve-paused' || (phase === 'download-paused' && downloadResolvedActive); }
            _computeShowDownloadStart(phase, processing) { return phase === 'resolve-done' && !processing; }
            _computeShowDownloadResume(phase, downloadResolvedActive) { return phase === 'download-paused' && !downloadResolvedActive; }
            _computeShowDownloadResolved(phase, downloadResolvedActive) {
                if (phase !== 'resolve-paused') return false;
                if (downloadResolvedActive) return false;
                // Check if any records have been resolved (non-reactive, but phase change triggers recompute)
                let resolvedCount = 0;
                if (this._urlRecords) {
                    for (let i = 0; i < this._urlRecords.length; i++) {
                        if (this._urlRecords[i].resolveStatus === 'resolved') {
                            resolvedCount++;
                            break; // at least one is enough to show the button
                        }
                    }
                }
                return resolvedCount > 0;
            }
            _computeShowResumePrefetched(phase, downloadResolvedActive) {
                return phase === 'download-paused' && downloadResolvedActive;
            }
            _computeShowImportButton(phase, processing) { return phase === 'idle' || phase === 'resolve-done'; }
            _computeShowExportButton(phase, processing, urlCount) { return !processing && urlCount > 0 && phase !== 'resolving' && phase !== 'downloading'; }
            _computeShowRetryFailed(phase, processing, urlCount) { return !processing && urlCount > 0 && phase !== 'resolving' && phase !== 'downloading'; }
            _computeShowMarkDone(phase, downloadResolvedActive) {
                return phase === 'download-paused' && !downloadResolvedActive;
            }
            _computeEmptyMessage(urlCount, visible) { return visible && urlCount === 0; }

            _computePhaseLabel(phase) {
                switch(phase) {
                    case 'resolving': case 'resolve-paused': return 'Resolving & Pre-fetching';
                    case 'resolve-done': return 'All Pre-fetched';
                    case 'downloading': case 'download-paused': return 'Downloading Chapters';
                    case 'done': return 'Complete';
                    default: return 'Idle';
                }
            }
            _computePhaseClass(phase) {
                switch(phase) {
                    case 'resolving': case 'resolve-paused': return 'phase-resolve';
                    case 'downloading': case 'download-paused': case 'resolve-done': return 'phase-download';
                    case 'done': return 'phase-done';
                    default: return '';
                }
            }
            _computePhaseSubtext(phase) {
                switch(phase) {
                    case 'idle': return 'Import a file to begin. Phase 1 resolves URLs, fetches chapter lists, and caches page URLs.';
                    case 'resolve-done': return 'All manga pre-fetched with chapter/page data cached in IndexedDB. Ready to download images.';
                    case 'done': return 'All chapters downloaded.';
                    default: return '';
                }
            }

            // ---- Visibility ----

            _getVisibilityClass(visible) { return visible ? '' : 'hide'; }
            get visible() { return this._visible; }

            // ---- Terminal Logging ----
            _log(message) {
                try {
                    let ts = new Date();
                    let datestr = ts.toLocaleDateString('en-CA'); // 2026-05-17
                    let timestr = ts.toLocaleTimeString('en-US', { hour12: true }); // 7:45:02 PM
                    this.ipc.send('import-log', '[' + datestr + ' ' + timestr + '] ' + message);
                }
                catch(e) { console.log(message); }
            }

            // ---- UI Helpers ----

            _getUrlStatusIcon(status) {
                switch(status) {
                    case 'pending':  return 'fa-clock';
                    case 'resolving': return 'fa-spinner fa-pulse';
                    case 'resolved':  return 'fa-check';
                    case 'failed':    return 'fa-exclamation-triangle';
                    default:          return 'fa-circle';
                }
            }
            _getUrlStatusClass(status) {
                switch(status) {
                    case 'pending':   return 'status-pending';
                    case 'resolving': return 'status-resolving';
                    case 'resolved':  return 'status-resolved';
                    case 'failed':    return 'status-failed';
                    default:          return '';
                }
            }
            _getUrlItemClass(status) {
                return status === 'failed' ? 'url-item url-item-failed' : 'url-item';
            }
            _getErrorVisibility(item, expandedUrl) {
                return (item.resolveStatus === 'failed' && item.resolveError && item.url === expandedUrl) ? '' : 'hide';
            }
            _getChaptersVisibility(item) {
                return (item.resolveStatus === 'resolved' && item.chapters && item.chapters.length > 0) ? '' : 'hide';
            }
            _getChaptersDone(item) {
                if (!item.chapters) return 0;
                return item.chapters.filter(function(c) { return c.downloadStatus === 'downloaded'; }).length;
            }
            _getChaptersTotal(item) {
                return item.chapters ? item.chapters.length : 0;
            }
            _getChapterIcon(status) {
                switch(status) {
                    case 'pending':     return 'fa-circle';
                    case 'downloading': return 'fa-spinner fa-pulse';
                    case 'downloaded':  return 'fa-check';
                    case 'fetching-pages': return 'fa-cloud-download-alt';
                    case 'pages-ready': return 'fa-images';
                    case 'failed':      return 'fa-exclamation-triangle';
                    default:            return 'fa-circle';
                }
            }

            _onUrlClick(e) {
                let item = e.model.item;
                if (item.resolveStatus === 'failed') {
                    this.set('_expandedUrl', this._expandedUrl === item.url ? null : item.url);
                }
            }

            // ---- Refresh Display Urls ----

            _refreshDisplayUrls() {
                // Only push a small window of records into Polymer for display
                // Strip heavy pageUrls arrays before Polymer data binding to avoid IPC size limit
                let slice = this._urlRecords.slice(0, 200);
                let displaySlice = slice.map(function(record) {
                    let display = {
                        url: record.url,
                        resolveStatus: record.resolveStatus,
                        resolveError: record.resolveError,
                        mangaMeta: record.mangaMeta,
                        chapters: null
                    };
                    if (record.chapters) {
                        display.chapters = record.chapters.map(function(ch) {
                            return {
                                chapterId: ch.chapterId,
                                title: ch.title,
                                downloadStatus: ch.downloadStatus,
                                downloadError: ch.downloadError
                            };
                        });
                    }
                    return display;
                });
                this.set('_displayUrls', displaySlice);
                this.set('_totalUrlCount', this._urlRecords.length);
            }

            // ---- Page URL Cache Helpers ----

            /**
             * Get page URLs for a chapter from the non-observable Map cache.
             * Falls back to chapterRec.pageUrls if not in cache (defensive).
             */
            _getPageUrlsForChapter(urlItem, chapterRec) {
                let key = urlItem.url + '::' + chapterRec.chapterId;
                if (this._pageUrlCache.has(key)) {
                    return this._pageUrlCache.get(key);
                }
                return chapterRec.pageUrls;
            }

            /**
             * Reattach page URLs from the cache onto chapter records before saving to IndexedDB.
             * With pageUrls now kept on records at all times, this is effectively a no-op
             * but kept for defensive compatibility.
             */
            _reattachPageUrlsForSave(record) {
                // pageUrls are always present on chapter records now (not nulled),
                // so no reattachment is needed. This method is kept as a defensive
                // compatibility shim for any code paths that may still call it.
            }

            /**
             * Detach page URLs from chapter records after saving to IndexedDB.
             * Now a no-op since pageUrls are kept on records as a fallback for
             * _trimPageUrlCache() evictions.
             */
            _detachPageUrlsAfterSave(record) {
                // pageUrls are intentionally kept on records now so that chapter
                // downloads still work when entries are evicted from _pageUrlCache.
                // No detachment is performed.
            }

            /**
             * Trim the page URL cache to ~5000 entries to prevent unbounded memory growth.
             * Removes the oldest entries when the cache exceeds the limit.
             */
            _trimPageUrlCache() {
                const MAX_CACHE_SIZE = 5000;
                if (this._pageUrlCache.size > MAX_CACHE_SIZE) {
                    // Delete oldest entries (Map iterates in insertion order)
                    let toDelete = this._pageUrlCache.size - MAX_CACHE_SIZE;
                    let keys = this._pageUrlCache.keys();
                    for (let i = 0; i < toDelete; i++) {
                        this._pageUrlCache.delete(keys.next().value);
                    }
                    this._log('[IMPORT] Trimmed page URL cache from ' + (this._pageUrlCache.size + toDelete) + ' to ' + this._pageUrlCache.size);
                }
            }

            // ---- Public API ----


            showPanel() {

                this.set('_visible', true);
                this.set('_statusText', 'Import Queue Manager');
            }

            // ---- Saved State (IndexedDB) ----

            async _checkSavedState() {
                let self = this;
                if (!this._db) {
                    this._log('[IMPORT] No IndexedDB available');
                    return;
                }
                self._log('[IMPORT] Checking for saved/paused queue state in IndexedDB...');
                try {
                    // Use cursor-based loading to avoid "Maximum IPC message size exceeded"
                    // when IndexedDB transfers records from the storage layer to the renderer.
                    // We cache pageUrls in a non-observable Map for faster lookup, but keep
                    // them on the records as well so that _trimPageUrlCache() evictions don't
                    // cause chapters to be silently skipped during download phase.
                    this._pageUrlCache = new Map();
                    this._urlRecords = [];
                    let urlCount = 0;
                    let repairedChapters = 0;
                    await this._db.getAllUrlsCursor(function(record) {
                        // Cache pageUrls in the Map for faster access, but keep them on
                        // the records as a fallback when entries are evicted from the cache.
                        if (record.chapters) {
                            for (let ci = 0; ci < record.chapters.length; ci++) {
                                let ch = record.chapters[ci];
                                if (ch.pageUrls && ch.pageUrls.length > 0) {
                                    this._pageUrlCache.set(record.url + '::' + ch.chapterId, ch.pageUrls);
                                }
                                // REPAIR: The old bug nulled pageUrls from records but marked chapters as
                                // 'downloaded' or 'pages-ready'. When we load from IndexedDB, chapters with
                                // missing pageUrls are corrupted — they were never actually fetched/downloaded.
                                // This catches ALL corrupted chapters regardless of current downloadStatus:
                                //   - 'downloaded'/'pages-ready' with no pageUrls (original bug)
                                //   - 'pending' with no pageUrls (after previous repair rounds)
                                //   - 'failed' with no pageUrls (previous repair saved them as failed)
                                // After repair, the resolve phase reset to 'idle' triggers the fast-path
                                // in _resolveAndPrefetch() to re-fetch page URLs. Chapters that legitimately
                                // fail (e.g. video content) will fail again in the fast-path — that's fine.
                                if (!ch.pageUrls || ch.pageUrls.length === 0) {
                                    ch.downloadStatus = 'pending';
                                    ch.downloadError = null;
                                    repairedChapters++;
                                }
                            }
                        }
                        this._urlRecords.push(record);
                        urlCount++;
                    }.bind(this));

                    // === DIAGNOSTIC: Dump database statistics to understand why repair isn't triggering ===
                    {
                        let totalChapters = 0;
                        let noPageUrls = 0;
                        let withPageUrls = 0;
                        let statusCounts = {};
                        let sampleRecord = null;
                        let sampleChapter = null;
                        for (let ri = 0; ri < this._urlRecords.length; ri++) {
                            let rec = this._urlRecords[ri];
                            if (rec.chapters) {
                                for (let ci = 0; ci < rec.chapters.length; ci++) {
                                    let ch = rec.chapters[ci];
                                    totalChapters++;
                                    let hasPageUrls = ch.pageUrls && ch.pageUrls.length > 0;
                                    if (hasPageUrls) withPageUrls++;
                                    else noPageUrls++;
                                    let status = ch.downloadStatus || 'undefined';
                                    statusCounts[status] = (statusCounts[status] || 0) + 1;
                                    if (sampleChapter === null) {
                                        sampleChapter = {
                                            chapterId: ch.chapterId,
                                            title: ch.title,
                                            downloadStatus: ch.downloadStatus,
                                            pageUrlsType: typeof ch.pageUrls,
                                            pageUrlsLength: ch.pageUrls ? ch.pageUrls.length : 'N/A',
                                            pageUrlsSample: ch.pageUrls ? ch.pageUrls.slice(0, 3) : null,
                                            downloadError: ch.downloadError
                                        };
                                    }
                                }
                            }
                            if (sampleRecord === null && rec.chapters && rec.chapters.length > 0) {
                                sampleRecord = {
                                    url: rec.url,
                                    resolveStatus: rec.resolveStatus,
                                    chapterCount: rec.chapters ? rec.chapters.length : 0
                                };
                            }
                        }
                        self._log('[IMPORT-DIAG] URL records: ' + this._urlRecords.length + ', Total chapters: ' + totalChapters);
                        self._log('[IMPORT-DIAG] Chapters with pageUrls: ' + withPageUrls + ', without: ' + noPageUrls);
                        self._log('[IMPORT-DIAG] Chapter status breakdown: ' + JSON.stringify(statusCounts));
                        self._log('[IMPORT-DIAG] Sample record: ' + JSON.stringify(sampleRecord));
                        self._log('[IMPORT-DIAG] Sample chapter: ' + JSON.stringify(sampleChapter));
                        self._log('[IMPORT-DIAG] repairedChapters: ' + repairedChapters);
                    }

                    if (repairedChapters > 0) {
                        self._log('[IMPORT] REPAIRED ' + repairedChapters + ' chapters that had missing page URLs (data corruption from previous buggy version)');
                        // Persist the repair to IndexedDB immediately
                        try {
                            await this._db.putUrls(this._urlRecords);
                        } catch(e) {
                            self._log('[IMPORT] Failed to persist repair: ' + e.message);
                        }
                    }

                    if (urlCount === 0) {
                        self._log('[IMPORT] No saved queue state found');
                        return;
                    }

                    let phase = await this._db.getMeta('phase');
                    let concurrency = await this._db.getMeta('concurrency');
                    let batchDelay = await this._db.getMeta('batchDelay');
                    let pageConcurrency = await this._db.getMeta('pageConcurrency');
                    let urlTimeout = await this._db.getMeta('urlTimeout');
                    let downloadResolvedActive = await this._db.getMeta('downloadResolvedActive');

                    self._log('[IMPORT] Found saved queue: phase=' + phase + ', ' + urlCount + ' URLs');
                    self._log('[IMPORT] Cached ' + this._pageUrlCache.size + ' chapter page-URL sets in JS Map (out of Polymer scope)');

                    // Normalize active phases to paused equivalents
                    let restorePhase = phase || 'resolve-paused';
                    // If chapters were repaired, reset the phase from 'resolve-done' to 'idle'
                    // so the user sees the "Resolve & Pre-fetch" button (fast-path will skip
                    // already-fetched chapters and only re-fetch missing page URLs).
                    if (repairedChapters > 0 && restorePhase === 'resolve-done') {
                        self._log('[IMPORT] Repair detected ' + repairedChapters + ' corrupted chapters — resetting phase to idle for re-resolution');
                        restorePhase = 'idle';
                        // Reset all URL records' resolveStatus to 'pending' so _processUrls()
                        // will iterate over them and trigger the fast-path in _resolveAndPrefetch()
                        // to re-fetch missing page URLs for chapters that were repaired.
                        for (let ri = 0; ri < this._urlRecords.length; ri++) {
                            this._urlRecords[ri].resolveStatus = 'pending';
                        }
                    }
                    if (restorePhase === 'downloading') restorePhase = 'download-paused';
                    if (restorePhase === 'resolving') restorePhase = 'resolve-paused';
                    if (restorePhase === 'done') restorePhase = 'resolve-paused';

                    if (downloadResolvedActive) this.set('_downloadResolvedActive', true);

                    this._processedIndex = 0;
                    this._downloadMangaIndex = 0;
                    this.set('_phase', restorePhase);
                    if (concurrency) this.set('_concurrency', concurrency);
                    if (batchDelay) this.set('_batchDelay', batchDelay);
                    if (pageConcurrency) this.set('_pageConcurrency', pageConcurrency);
                    if (urlTimeout) this.set('_urlTimeout', urlTimeout);

                    // Calculate progress for display
                    let resolved = 0, failed = 0;
                    let totalChapters = 0;
                    let downloadedChapters = 0;
                    for (let ui = 0; ui < this._urlRecords.length; ui++) {
                        let u = this._urlRecords[ui];
                        if (u.resolveStatus === 'resolved') resolved++;
                        else if (u.resolveStatus === 'failed') failed++;
                        if (u.chapters) {
                            for (let ci = 0; ci < u.chapters.length; ci++) {
                                let c = u.chapters[ci];
                                totalChapters++;
                                if (c.downloadStatus === 'downloaded') downloadedChapters++;
                            }
                        }
                    }

                    if (restorePhase === 'resolve-paused' || restorePhase === 'idle') {
                        let pct = Math.round(((resolved + failed) / urlCount) * 100) || 0;
                        self.set('_progressPercent', pct);
                        self.set('_statusText', 'Saved: ' + (resolved + failed) + '/' + urlCount + ' resolved, ' + downloadedChapters + '/' + totalChapters + ' chapters downloaded');
                    } else if (restorePhase === 'download-paused' || restorePhase === 'resolve-done') {
                        let pct = totalChapters > 0 ? Math.round((downloadedChapters / totalChapters) * 100) : 50;
                        self.set('_progressPercent', pct);
                        self.set('_statusText', 'Saved: ' + downloadedChapters + '/' + totalChapters + ' chapters downloaded. ' + resolved + ' manga ready.');
                    }

                    this._refreshDisplayUrls();
                    self.set('_visible', true);
                } catch(e) {
                    self._log('[IMPORT] Error checking saved state: ' + e.message);
                }
            }

            async _saveMeta() {
                if (!this._db) return;
                try {
                    await this._db.putMeta('phase', this._phase);
                    await this._db.putMeta('concurrency', this._concurrency);
                    await this._db.putMeta('batchDelay', this._batchDelay);
                    await this._db.putMeta('pageConcurrency', this._pageConcurrency);
                    await this._db.putMeta('urlTimeout', this._urlTimeout);
                    await this._db.putMeta('downloadResolvedActive', this._downloadResolvedActive);
                } catch(e) {
                    this._log('[IMPORT] Meta save failed: ' + e.message);
                }
            }

            async _clearSavedState() {
                if (!this._db) return;
                this._log('[IMPORT] Clearing saved queue state');
                try {
                    await this._db.reset();
                } catch(e) {
                    this._log('[IMPORT] Clear state failed: ' + e.message);
                }
            }

            // ---- Event Handlers ----

            _onCloseClick() {
                this._log('[IMPORT] Close button clicked');
                if (this._isRunning) {
                    if (!confirm('Import is in progress. Pause and close?')) return;
                }
                // Abort all in-flight download requests immediately before closing
                // to prevent orphaned fetch() calls from triggering "not yet ready" IPC errors
                this._abortControllers.forEach(function(c) { c.abort(); });
                this._abortControllers = [];
                this._pauseQueue();
                this.set('_visible', false);
                this.set('_expandedUrl', null);
            }

            _onStartClick() {
                this._log('[IMPORT] -> Resolve & Pre-fetch clicked');
                if (this._processing) return;
                this.set('_phase', 'resolving');
                this.set('_expandedUrl', null);
                this._processUrls();
            }

            _onResumeClick() {
                this._log('[IMPORT] -> Resume resolving clicked');
                if (this._processing) return;
                this.set('_phase', 'resolving');
                this.set('_expandedUrl', null);
                this.set('_downloadResolvedActive', false);
                this._processUrls();
            }

            _onDownloadStartClick() {
                this._log('[IMPORT] -> Start Downloads clicked');
                if (this._processing) return;
                this.set('_phase', 'downloading');
                this._downloadMangaIndex = 0;
                this.set('_expandedUrl', null);
                this._processDownloads();
            }

            _onDownloadResumeClick() {
                this._log('[IMPORT] -> Resume Downloads clicked');
                if (this._processing) return;
                // Reset all failed chapters to 'pending' so they get retried
                let resetCount = 0;
                for (let i = 0; i < this._urlRecords.length; i++) {
                    if (this._urlRecords[i].chapters) {
                        for (let c = 0; c < this._urlRecords[i].chapters.length; c++) {
                            if (this._urlRecords[i].chapters[c].downloadStatus === 'failed') {
                                this._urlRecords[i].chapters[c].downloadStatus = 'pending';
                                this._urlRecords[i].chapters[c].downloadError = null;
                                resetCount++;
                            }
                        }
                    }
                }
                if (resetCount > 0) {
                    this._log('[IMPORT] Reset ' + resetCount + ' failed chapters to pending for retry');
                }
                this.set('_phase', 'downloading');
                this._downloadMangaIndex = 0;
                this.set('_expandedUrl', null);
                this._processDownloads();
            }

            _onPauseClick() {
                this._pauseQueue();
            }

            async _onDownloadResolvedClick() {
                this._log('[IMPORT] -> Download Pre-fetched clicked');
                if (this._processing) return;
                // Count how many resolved manga are available to download
                let resolvedCount = 0;
                let totalChapters = 0;
                for (let i = 0; i < this._urlRecords.length; i++) {
                    if (this._urlRecords[i].resolveStatus === 'resolved') {
                        resolvedCount++;
                        if (this._urlRecords[i].chapters) {
                            for (let c = 0; c < this._urlRecords[i].chapters.length; c++) {
                                let st = this._urlRecords[i].chapters[c].downloadStatus;
                                if (st !== 'downloaded' && st !== 'failed') totalChapters++;
                            }
                        }
                    }
                }
                this._log('[IMPORT] Downloading ' + resolvedCount + ' pre-fetched manga (' + totalChapters + ' remaining chapters)');
                this.set('_downloadResolvedActive', true);
                this.set('_phase', 'downloading');
                this._downloadMangaIndex = 0;
                this.set('_expandedUrl', null);
                // Set flag so _processDownloads() does not clear saved state
                // (which would wipe unresolved records still in the queue)
                this._deferClearState = true;
                await this._processDownloads();
                this._deferClearState = false;
                // Restore to resolve-paused so the user can continue resolving the rest
                // BUT only if not paused — if phase is 'download-paused', keep _downloadResolvedActive
                // so the "Resume Pre-fetched" button appears.
                if (this._phase === 'done' || this._phase === 'resolve-done') {
                    this._log('[IMPORT] Returning to resolve-paused after pre-fetched download');
                    this.set('_phase', 'resolve-paused');
                    this.set('_statusText', 'Pre-fetched downloads finished. Resume resolving to continue.');
                    await this._saveMeta();
                    this.set('_downloadResolvedActive', false);
                } else if (this._phase === 'download-paused') {
                    // User paused during pre-fetched download — keep _downloadResolvedActive=true
                    // so the "Resume Pre-fetched" button shows in the UI
                    this._log('[IMPORT] Pre-fetched download paused. Keep _downloadResolvedActive for Resume button.');
                    this.set('_statusText', 'Pre-fetched downloads paused. Click Resume Pre-fetched to continue.');
                    // Keep _downloadResolvedActive=true so _computeShowResumePrefetched returns true
                    return; // skip setting _downloadResolvedActive to false
                }
                this.set('_downloadResolvedActive', false);
                this._refreshDisplayUrls();
            }

            async _onResumePrefetchedClick() {
                this._log('[IMPORT] -> Resume Pre-fetched clicked');
                if (this._processing) return;
                // Count remaining resolved manga with remaining chapters
                let remainingManga = 0;
                let remainingChapters = 0;
                for (let i = 0; i < this._urlRecords.length; i++) {
                    if (this._urlRecords[i].resolveStatus === 'resolved') {
                        let hasRemaining = false;
                        if (this._urlRecords[i].chapters) {
                            for (let c = 0; c < this._urlRecords[i].chapters.length; c++) {
                                let st = this._urlRecords[i].chapters[c].downloadStatus;
                                if (st !== 'downloaded' && st !== 'failed') {
                                    remainingChapters++;
                                    hasRemaining = true;
                                }
                            }
                        }
                        if (hasRemaining) remainingManga++;
                    }
                }
                this._log('[IMPORT] Resuming pre-fetched download for ' + remainingManga + ' manga (' + remainingChapters + ' remaining chapters)');
                this.set('_phase', 'downloading');
                // Keep _downloadResolvedActive=true so that _computeShowResumePrefetched still works
                // when/if paused again
                this._downloadMangaIndex = 0;
                this.set('_expandedUrl', null);
                await this._processDownloads();
                // After completion, check phase
                if (this._phase === 'done' || this._phase === 'resolve-done') {
                    this._log('[IMPORT] Pre-fetched download complete, returning to resolve-paused');
                    this.set('_phase', 'resolve-paused');
                    this.set('_statusText', 'Pre-fetched downloads finished. Resume resolving to continue.');
                    await this._saveMeta();
                    this.set('_downloadResolvedActive', false);
                } else if (this._phase === 'download-paused') {
                    this._log('[IMPORT] Pre-fetched download paused again.');
                    this.set('_statusText', 'Pre-fetched downloads paused. Click Resume Pre-fetched to continue.');
                    // Keep _downloadResolvedActive=true
                }
                this._refreshDisplayUrls();
            }

            async _pauseQueue() {
                this._log('[IMPORT] PAUSING...');
                // Close any open BrowserWindows created by connectors during resolution
                if (Engine && Engine.Request && Engine.Request.closeAllWindows) {
                    Engine.Request.closeAllWindows();
                }
                // Abort all in-flight download requests immediately
                // This causes the worker pool's fetch() calls to throw AbortError,
                // which will mark the current chapter as failed (can be retried later)
                this._abortControllers.forEach(function(c) { c.abort(); });
                this._abortControllers = [];
                let pausedPhase = this._phase === 'resolving' ? 'resolve-paused' : 'download-paused';
                this.set('_phase', pausedPhase);
                this.set('_statusText', 'Paused (saving state...)');
                await this._saveMeta();
                this.set('_statusText', 'Paused');
                this._log('[IMPORT] PAUSING COMPLETE');
            }

            async _onResetClick() {
                this._log('[IMPORT] Reset clicked');
                if (this._isRunning) {
                    if (!confirm('Reset will stop the current import. Are you sure?')) return;
                }
                // Close any open BrowserWindows created by connectors during resolution
                if (Engine && Engine.Request && Engine.Request.closeAllWindows) {
                    Engine.Request.closeAllWindows();
                }
                // Abort any in-flight download requests
                this._abortControllers.forEach(function(c) { c.abort(); });
                this._abortControllers = [];
                this._urlRecords = [];
                this._processedIndex = 0;
                this._downloadMangaIndex = 0;
                this._pageUrlCache = new Map();
                this.set('_displayUrls', []);
                this.set('_totalUrlCount', 0);
                this.set('_progressPercent', 0);
                this.set('_phase', 'idle');
                this.set('_statusText', 'Ready');
                this.set('_expandedUrl', null);
                await this._clearSavedState();
            }

            async _onMarkDoneClick() {
                this._log('[IMPORT] -> Mark Done clicked (' + this._downloadProgressOk + ' OK, ' + this._downloadProgressFail + ' failed)');
                if (this._processing) return;
                this.set('_phase', 'resolve-paused');
                this.set('_statusText', 'Done: ' + this._downloadProgressOk + ' chapters downloaded, ' + this._downloadProgressFail + ' failed/missed.');
                this.set('_progressPercent', 100);
                await this._saveMeta();
            }

            async _onRetryFailedClick() {
                this._log('[IMPORT] -> Retry Failed clicked');
                if (this._processing) return;
                // Find all failed URL records and reset them
                let retryCount = 0;
                for (let i = 0; i < this._urlRecords.length; i++) {
                    if (this._urlRecords[i].resolveStatus === 'failed') {
                        this._urlRecords[i].resolveStatus = 'pending';
                        this._urlRecords[i].resolveError = null;
                        retryCount++;
                    }
                }
                if (retryCount === 0) {
                    this._log('[IMPORT] No failed URLs to retry');
                    return;
                }
                this._log('[IMPORT] Retrying ' + retryCount + ' failed URLs');
                this._processedIndex = 0;
                this._refreshDisplayUrls();
                this.set('_statusText', 'Retrying ' + retryCount + ' failed URLs...');
                this.set('_phase', 'resolving');
                this.set('_expandedUrl', null);
                this._processUrls();
            }

            // ---- Export to JSON ----

            async _onExportClick() {
                this._log('[IMPORT] -> Export to JSON clicked');
                if (!this._db) {
                    this._log('[IMPORT] No IndexedDB available');
                    return;
                }
                try {
                    this.set('_statusText', 'Reading records from IndexedDB...');
                    this._log('[IMPORT] Reading URL records from IndexedDB using cursor...');

                    // Use cursor-based iteration to avoid "Maximum IPC message size exceeded"
                    // when the dataset is large. getAllUrlsCursor() streams records individually.
                    // pageUrls arrays are kept on records since they contain the actual image URLs
                    // that users want in the exported JSON. The streaming write loop below handles
                    // them without UI freezing because each record is stringified individually.
                    let urls = [];
                    await this._db.getAllUrlsCursor(function(record) {
                        urls.push(record);
                    });
                    this._log('[IMPORT] Read ' + urls.length + ' URL records from IndexedDB');

                    // Yield to let Polymer re-render status text changes
                    await new Promise(r => setTimeout(r, 0));

                    // Read meta keys
                    let phase = await this._db.getMeta('phase');
                    let concurrency = await this._db.getMeta('concurrency');
                    let batchDelay = await this._db.getMeta('batchDelay');
                    let pageConcurrency = await this._db.getMeta('pageConcurrency');
                    let urlTimeout = await this._db.getMeta('urlTimeout');

                    // Yield to let Polymer re-render status text changes
                    await new Promise(r => setTimeout(r, 0));

                    // Generate timestamp for filename
                    let now = new Date();
                    let dateStr = now.toLocaleDateString('en-CA'); // 2026-05-23
                    let timeStr = now.toLocaleTimeString('en-US', { hour12: false }); // 14:41:41
                    let fileTimestamp = dateStr + '_' + timeStr.replace(/:/g, '-'); // 2026-05-23_14-41-41

                    this.set('_statusText', 'Opening save dialog...');
                    let result = await this._electron.remote.dialog.showSaveDialog({
                        title: 'Export Import Queue',
                        defaultPath: 'hakuneko-import-queue_' + fileTimestamp + '.json',
                        filters: [
                            { name: 'JSON Files', extensions: ['json'] }
                        ]
                    });

                    if (result.canceled || !result.filePath) {
                        this._log('[IMPORT] Export cancelled by user');
                        this.set('_statusText', 'Export cancelled');
                        return;
                    }

                    this._log('[IMPORT] Writing to file: ' + result.filePath);
                    this.set('_statusText', 'Writing ' + urls.length + ' records to ' + result.filePath + '...');

                    // Stream-write JSON to file using WriteStream.
                    // This avoids materializing the entire JSON string in memory and
                    // allows yielding between batches so the UI stays responsive.
                    let fs = require('fs');
                    let stream = fs.createWriteStream(result.filePath, { encoding: 'utf8' });

                    // Write opening: { "version": 1, ..., "urls": [
                    stream.write('{\n');
                    stream.write('  "version": 1,\n');
                    stream.write('  "exportedAt": ' + JSON.stringify(now.toISOString()) + ',\n');
                    stream.write('  "meta": {\n');
                    stream.write('    "phase": ' + JSON.stringify(phase) + ',\n');
                    stream.write('    "concurrency": ' + concurrency + ',\n');
                    stream.write('    "batchDelay": ' + batchDelay + ',\n');
                    stream.write('    "pageConcurrency": ' + pageConcurrency + ',\n');
                    stream.write('    "urlTimeout": ' + urlTimeout + '\n');
                    stream.write('  },\n');
                    stream.write('  "urls": [\n');

                    // Write each record as JSON, yielding every 500 records
                    const YIELD_INTERVAL = 500;
                    for (let i = 0; i < urls.length; i++) {
                        stream.write(JSON.stringify(urls[i]));
                        if (i < urls.length - 1) {
                            stream.write(',');
                        }
                        stream.write('\n');

                        // Yield every YIELD_INTERVAL records to keep the UI responsive
                        if (i > 0 && i % YIELD_INTERVAL === 0) {
                            this._log('[IMPORT] Writing: ' + i + '/' + urls.length + ' records');
                            this.set('_statusText', 'Writing ' + i + '/' + urls.length + ' records to ' + result.filePath + '...');
                            await new Promise(r => setTimeout(r, 0));
                        }
                    }

                    // Write closing: ]}
                    stream.write(']\n');
                    stream.write('}\n');

                    // Close the stream and wait for it to finish flushing to disk
                    await new Promise(function(resolve, reject) {
                        stream.end(resolve);
                        stream.on('error', reject);
                    });

                    // Yield to let Polymer re-render the final status text
                    await new Promise(r => setTimeout(r, 0));

                    this._log('[IMPORT] Exported ' + urls.length + ' URL records to ' + result.filePath);
                    this._log('[IMPORT] Export complete at ' + dateStr + ', ' + now.toLocaleTimeString('en-US', { hour12: true }));
                    this.set('_statusText', 'Exported ' + urls.length + ' records to ' + result.filePath);
                } catch(e) {
                    this._log('[IMPORT] Export error: ' + e.message);
                    this.set('_statusText', 'Export failed: ' + e.message);
                }
            }

            // ---- File Picker ----

            async openFilePicker() {

                this._log('[IMPORT] Opening file picker dialog...');
                let result = await this._electron.remote.dialog.showOpenDialog({
                    title: 'Select URL Import File',
                    properties: ['openFile'],
                    filters: [
                        { name: 'Text Files', extensions: ['txt', 'csv', 'urls'] },
                        { name: 'All Files', extensions: ['*'] }
                    ]
                });

                if (result.canceled || !result.filePaths || result.filePaths.length === 0) {
                    this._log('[IMPORT] File picker cancelled');
                    return;
                }
                this._log('[IMPORT] User selected file: ' + result.filePaths[0]);

                this.set('_visible', true);
                this.set('_statusText', 'Reading file...');
                this.set('_expandedUrl', null);
                this._urlRecords = [];
                this._pageUrlCache = new Map();
                this._refreshDisplayUrls();
                await new Promise(function(resolve) { setTimeout(resolve, 50); });

                let fs = require('fs');
                let content = fs.readFileSync(result.filePaths[0], 'utf8');
                this._log('[IMPORT] File read: ' + content.length + ' bytes');

                this.set('_statusText', 'Parsing URLs...');
                await new Promise(function(resolve) { setTimeout(resolve, 50); });

                let lines = content.split(/\r?\n/).filter(function(line) { return line.trim().length > 0; });
                this._log('[IMPORT] Found ' + lines.length + ' URLs in file');

                if (lines.length === 0) {
                    alert('The selected file contains no URLs.');
                    this.set('_statusText', 'Ready');
                    return;
                }

                this.set('_statusText', 'Checking for previously cached records in IndexedDB (' + lines.length + ')...');

                // Insert URL records with dedup: check IDB for existing records
                // so that reimporting a URL file skips already-resolved manga
                let records = [];
                let skippedCount = 0;
                let partialRetryCount = 0;
                let failedRetryCount = 0;
                for (let i = 0; i < lines.length; i++) {
                    let url = lines[i].trim();
                    let existingRecord = null;
                    if (this._db) {
                        try {
                            existingRecord = await this._db.getUrl(url);
                        } catch(e) {
                            // Ignore lookup errors, treat as new record
                        }
                    }
                    if (existingRecord) {
                        if (existingRecord.resolveStatus === 'resolved') {
                            // Check if this manga is fully resolved (all chapters have pageUrls)
                            let fullyDone = true;
                            if (existingRecord.chapters) {
                                for (let c = 0; c < existingRecord.chapters.length; c++) {
                                    if (!existingRecord.chapters[c].pageUrls || existingRecord.chapters[c].pageUrls.length === 0) {
                                        fullyDone = false;
                                        break;
                                    }
                                }
                            }
                            if (fullyDone) {
                                // Fully resolved and cached — skip entirely
                                this._urlRecords.push(existingRecord);
                                skippedCount++;
                                continue;
                            } else {
                                // Partially resolved — re-add as pending to fill in missing chapter page URLs
                                partialRetryCount++;
                            }
                        } else if (existingRecord.resolveStatus === 'failed') {
                            failedRetryCount++;
                        }
                        // For partial or failed records, fall through and re-add as pending
                    }
                    records.push({
                        url: url,
                        resolveStatus: 'pending',
                        resolveError: null,
                        mangaMeta: null,
                        chapters: null,
                        lastUpdated: Date.now()
                    });
                    // Batch into IndexedDB every 500 records
                    if (i > 0 && i % 500 === 0) {
                        if (this._db) {
                            await this._db.putUrls(records);
                        }
                        this._urlRecords = this._urlRecords.concat(records);
                        records = [];
                        this._log('[IMPORT] Stored ' + i + ' URLs (' + skippedCount + ' skipped, ' + partialRetryCount + ' partial, ' + failedRetryCount + ' failed-retry)...');
                        await new Promise(function(resolve) { setTimeout(resolve, 10); });
                    }
                }
                // Final batch
                if (records.length > 0) {
                    if (this._db) {
                        await this._db.putUrls(records);
                    }
                    this._urlRecords = this._urlRecords.concat(records);
                }
                if (skippedCount > 0) {
                    this._log('[IMPORT] Dedup: skipped ' + skippedCount + ' already-resolved manga, retrying ' + partialRetryCount + ' partial + ' + failedRetryCount + ' failed');
                }


                this._processedIndex = 0;
                this._downloadMangaIndex = 0;
                this.set('_progressPercent', 0);
                this.set('_phase', 'idle');
                this._refreshDisplayUrls();
                this.set('_statusText', 'Loaded ' + lines.length + ' URLs. Click "Resolve & Pre-fetch" to begin.');
                await this._saveMeta();
            }

            // ---- Phase 1: URL Resolution + Chapter Pre-fetch ----

            async _processUrls() {
                if (this._processing) return;
                this._processing = true;
                let self = this;
                let concurrency = this._concurrency;
                let delay = this._batchDelay;
                let batchCount = 0;

                try {
                    while (this._phase === 'resolving' && this._processedIndex < this._urlRecords.length) {
                        // Find pending records starting from current index
                        let batch = [];
                        for (let i = this._processedIndex; i < this._urlRecords.length && batch.length < concurrency; i++) {
                            if (this._urlRecords[i].resolveStatus === 'pending') {
                                batch.push(i);
                            }
                        }
                        if (batch.length === 0) {
                            // Check if any pending left
                            let allDone = true;
                            for (let i = 0; i < this._urlRecords.length; i++) {
                                if (this._urlRecords[i].resolveStatus === 'pending') { allDone = false; break; }
                            }
                            if (allDone) break;
                            this._processedIndex++;
                            continue;
                        }

                        batchCount++;
                        // Mark as resolving
                        batch.forEach(function(idx) {
                            self._urlRecords[idx].resolveStatus = 'resolving';
                        });

                        // Process all URLs in the batch concurrently with a per-URL timeout
                        let urlTimeout = this._urlTimeout;
                        let timeoutMinutes = Math.round(urlTimeout / 60000);
                        let settled = await Promise.allSettled(batch.map(function(idx) {
                            return Promise.race([
                                self._resolveAndPrefetch(idx),
                                new Promise(function(_, reject) { setTimeout(function() { reject(new Error('URL resolution timed out after ' + timeoutMinutes + 'm')); }, urlTimeout); })
                            ]);
                        }));

                        // Log any timeouts/failures at the batch level
                        settled.forEach(function(result, i) {
                            if (result.status === 'rejected') {
                                let idx = batch[i];
                                if (self._urlRecords[idx] && self._urlRecords[idx].resolveStatus !== 'resolved' && self._urlRecords[idx].resolveStatus !== 'failed') {
                                    self._urlRecords[idx].resolveStatus = 'failed';
                                    self._urlRecords[idx].resolveError = result.reason.message;
                                    self._log('[IMPORT] FAIL (timeout) ' + self._urlRecords[idx].url + ' -> ' + result.reason.message);
                                }
                            }
                        });

                        this._processedIndex += batch.length;
                        this._refreshDisplayUrls();

                        // Yield to the rendering engine so the UI doesn't go white
                        await new Promise(function(resolve) { setTimeout(resolve, 0); });

                        // Update progress
                        let resolved = 0, failed = 0;
                        for (let i = 0; i < this._urlRecords.length; i++) {
                            if (this._urlRecords[i].resolveStatus === 'resolved') resolved++;
                            else if (this._urlRecords[i].resolveStatus === 'failed') failed++;
                        }
                        let pct = Math.round(((resolved + failed) / this._urlRecords.length) * 100);
                        this.set('_progressPercent', pct);
                        this.set('_statusText', 'Pre-fetched ' + resolved + '/' + this._urlRecords.length + ' (' + pct + '%), ' + failed + ' failed');
                        // Terminal log each batch so user sees real-time progress
                        if (batchCount % 3 === 1) { // log every 3rd batch to avoid flood
                            this._log('[IMPORT] PROGRESS: ' + resolved + '/' + this._urlRecords.length + ' resolved (' + pct + '%), ' + failed + ' failed');
                        }

                        // Save each completed batch of urls to IndexedDB immediately.
                        // Per-URL saves in _resolveAndPrefetch were removed to reduce IPC
                        // contention with onBeforeSendHeaders, but we still persist each
                        // batch so completed work is crash-safe.
                        if (this._db) {
                            try {
                                let batchRecs = batch.map(function(idx) { return self._urlRecords[idx]; });
                                // Reattach pageUrls from cache before saving
                                for (let bi = 0; bi < batchRecs.length; bi++) {
                                    self._reattachPageUrlsForSave(batchRecs[bi]);
                                }
                                await this._db.putUrls(batchRecs);
                                // Detach pageUrls after saving
                                for (let bi = 0; bi < batchRecs.length; bi++) {
                                    self._detachPageUrlsAfterSave(batchRecs[bi]);
                                }
                            } catch(e) {
                                self._log('[IMPORT] Batch save error: ' + e.message);
                            }
                        }


                        // Trim the page URL cache to prevent unbounded memory growth
                        this._trimPageUrlCache();

                        if (delay > 0 && this._phase === 'resolving') {
                            await new Promise(function(resolve) { setTimeout(resolve, delay); });
                        }
                    }

                    // Save all pending records to IndexedDB
                    if (this._db) {
                        try {
                            let pendingSave = this._urlRecords.filter(function(u) { return u.lastUpdated < Date.now() - 100; });
                            if (pendingSave.length > 0) {
                                for (let pi = 0; pi < pendingSave.length; pi++) {
                                    self._reattachPageUrlsForSave(pendingSave[pi]);
                                }
                                await this._db.putUrls(pendingSave);
                                for (let pi = 0; pi < pendingSave.length; pi++) {
                                    self._detachPageUrlsAfterSave(pendingSave[pi]);
                                }
                            }
                        } catch(e) {
                            self._log('[IMPORT] Final save error: ' + e.message);
                        }
                    }

                    if (this._phase === 'resolving') {
                        let resolved = 0, failed = 0;
                        for (let i = 0; i < this._urlRecords.length; i++) {
                            if (this._urlRecords[i].resolveStatus === 'resolved') resolved++;
                            else if (this._urlRecords[i].resolveStatus === 'failed') failed++;
                        }
                        this._log('[IMPORT] Pre-fetch done: ' + resolved + ' OK, ' + failed + ' failed');
                        this.set('_phase', 'resolve-done');
                        this.set('_statusText', resolved + ' pre-fetched, ' + failed + ' failed. Ready to download.');
                        this.set('_progressPercent', 100);
                        await this._saveMeta();
                    }
                } catch (error) {
                    this._log('[IMPORT] Error: ' + error.message);
                    this.set('_phase', 'resolve-paused');
                } finally {
                    this._processing = false;
                }
            }

            /**
             * Resolve a URL, fetch chapters, and pre-fetch page URLs.
             * Everything is stored in the internal _urlRecords array.
             */
            async _resolveAndPrefetch(index) {
                let self = this;
                let urlItem = this._urlRecords[index];

                let url = urlItem.url;
                try {
                    // ---- FAST PATH: Skip expensive manga/chapter resolution if already resolved ----
                    // If mangaMeta and chapters already exist, we only need to re-fetch
                    // page URLs for chapters that are missing them. This avoids days of
                    // re-resolution after fixing corrupted IndexedDB data.
                    if (urlItem.mangaMeta && urlItem.chapters && urlItem.chapters.length > 0) {
                        let missingPageUrls = 0;
                        for (let fc = 0; fc < urlItem.chapters.length; fc++) {
                            let ch = urlItem.chapters[fc];
