                            // Skip chapters that already have page URLs or are already done/failed
                            if (ch.pageUrls && ch.pageUrls.length > 0) continue;
                            if (ch.downloadStatus === 'downloaded') continue;
                            missingPageUrls++;
                        }

                        if (missingPageUrls === 0) {
                            // All chapters already have pageUrls — nothing to do
                            // BUT still ensure resolveStatus is 'resolved' so Phase 2 can proceed
                            urlItem.resolveStatus = 'resolved';
                            this._log('[IMPORT] FAST-PATH (skip): ' + urlItem.mangaMeta.mangaTitle + ' — all ' + urlItem.chapters.length + ' chapters already have page URLs cached');
                            return;
                        }

                        this._log('[IMPORT] FAST-PATH: ' + urlItem.mangaMeta.mangaTitle + ' — re-fetching page URLs for ' + missingPageUrls + '/' + urlItem.chapters.length + ' chapters');

                        // Find the connector from Engine by the stored connectorId
                        let connector = Engine.Connectors.find(function(c) { return c.id === urlItem.mangaMeta.connectorId; });
                        if (!connector) {
                            throw new Error('Fast-path: connector ' + urlItem.mangaMeta.connectorId + ' not found for ' + urlItem.url);
                        }

                        // Create Manga and Chapter objects using the already-known metadata
                        let Manga = this._MangaClass;
                        if (!Manga) throw new Error('Manga class not loaded');
                        let manga = new Manga(connector, urlItem.mangaMeta.mangaId, urlItem.mangaMeta.mangaTitle);

                        let ChapterClass = this._ChapterClass;
                        if (!ChapterClass) throw new Error('Chapter class not loaded');

                        // Use controlled concurrency for chapter page-fetches within each manga
                        // to avoid sequentially waiting for each chapter's getPages().
                        let pageConcurrency = this._pageConcurrency || 5;
                        let chapterFetchIndex = 0;

                        async function fetchChapterPages() {
                            while (chapterFetchIndex < urlItem.chapters.length) {
                                let ci;
                                // Atomically grab the next unprocessed chapter index
                                ci = chapterFetchIndex++;
                                if (ci >= urlItem.chapters.length) break;

                                let chapterRec = urlItem.chapters[ci];

                                // Skip chapters that already have page URLs cached
                                if (chapterRec.pageUrls && chapterRec.pageUrls.length > 0) continue;
                                // Skip already-downloaded chapters
                                if (chapterRec.downloadStatus === 'downloaded') continue;

                                try {
                                    let chapter = new ChapterClass(manga, chapterRec.chapterId, chapterRec.title);
                                    let pages = await new Promise(function(resolve, reject) {
                                        chapter.getPages(function(error, data) {
                                            if (error) reject(error);
                                            else resolve(data);
                                        });
                                    });

                                    // Phase check: bail if paused during fast-path (flag for all workers)
                                    if (self._phase !== 'resolving') {
                                        chapterRec.downloadStatus = 'failed';
                                        chapterRec.downloadError = 'Paused during page pre-fetch (fast-path)';
                                        // Signal other workers to stop by advancing index past end
                                        chapterFetchIndex = urlItem.chapters.length;
                                        break;
                                    }

                                    if (pages instanceof Array) {
                                        chapterRec.pageUrls = pages;
                                        chapterRec.downloadStatus = 'pages-ready';
                                    } else {
                                        chapterRec.downloadStatus = 'failed';
                                        chapterRec.downloadError = 'Non-image content (video/stream)';
                                    }
                                } catch(e) {
                                    chapterRec.downloadStatus = 'failed';
                                    chapterRec.downloadError = e.message;
                                }

                                // Cache page URLs if we got them
                                if (chapterRec.pageUrls && chapterRec.pageUrls.length > 0) {
                                    self._pageUrlCache.set(urlItem.url + '::' + chapterRec.chapterId, chapterRec.pageUrls);
                                }
                            }
                        }

                        // Launch worker pool for concurrent chapter page-fetching
                        let workers = [];
                        for (let w = 0; w < pageConcurrency; w++) {
                            workers.push(fetchChapterPages());
                        }
                        await Promise.all(workers);
                        // Trim the page URL cache after processing a manga's chapters
                        self._trimPageUrlCache();
                        // Log each manga's result
                        self._log('[IMPORT] DONE (fast-path) ' + urlItem.mangaMeta.mangaTitle + ' (' + urlItem.chapters.length + ' chapters)');
                        urlItem.resolveStatus = 'resolved';
                        return;

                    }

                    // ---- FULL RESOLUTION PATH (for new/not-yet-resolved manga) ----
                    let uri = new URL(url);
                    let connectors = Engine.Connectors.filter(function(c) { return c.canHandleURI && c.canHandleURI(uri); });
                    if (!connectors.length) {
                        connectors = Engine.Connectors.filter(function(c) { return c.url && c.url.includes(uri.hostname); });
                    }
                    if (connectors.length > 1) {
                        let pathname = uri.pathname;
                        connectors = connectors.filter(function(c) { return pathname.startsWith(new URL(c.url).pathname); });
                    }
                    if (!connectors.length) throw new Error('No matching connector found for ' + uri.href);
                    if (connectors.length > 1) throw new Error('Too many connectors for ' + uri.href);

                    let connector = connectors[0];
                    let manga = await connector.getMangaFromURI(uri);

                    // Phase check: bail if paused after getMangaFromURI
                    if (this._phase !== 'resolving') throw new Error('Paused during resolution');

                    // Store manga metadata
                    urlItem.mangaMeta = {
                        connectorId: connector.id,
                        mangaId: manga.id,
                        mangaTitle: manga.title
                    };

                    // Create a proper Manga object to fetch chapters
                    let Manga = this._MangaClass;
                    if (!Manga) throw new Error('Manga class not loaded');
                    let mangaObj = new Manga(connector, manga.id, manga.title);

                    // Fetch chapters
                    let chapters = await new Promise(function(resolve, reject) {
                        mangaObj.getChapters(function(error, chs) {
                            if (error) reject(error); else resolve(chs);
                        });
                    });

                    // Phase check: bail if paused after getChapters
                    if (this._phase !== 'resolving') throw new Error('Paused after fetching chapters');

                    if (!chapters || chapters.length === 0) {
                        urlItem.resolveStatus = 'resolved';
                        urlItem.chapters = [];
                        return;
                    }

                    // Pre-allocate chapter records so concurrent workers can populate them in-place
                    let chapterRecords = [];
                    for (let c = 0; c < chapters.length; c++) {
                        chapterRecords.push({
                            chapterId: chapters[c].id,
                            title: chapters[c].title,
                            pageUrls: null,
                            downloadStatus: 'pending',
                            downloadError: null
                        });
                    }

                    // Use controlled concurrency for chapter page-fetches within each manga
                    // to avoid sequentially waiting for each chapter's getPages().
                    // Reuses the existing _pageConcurrency setting from the UI dropdown.
                    let pageConcurrency = this._pageConcurrency || 5;
                    let chapterFetchIndex = 0;

                    async function fetchChapterPages() {
                        while (chapterFetchIndex < chapterRecords.length) {
                            let ci = chapterFetchIndex++;
                            if (ci >= chapterRecords.length) break;

                            let record = chapterRecords[ci];
                            let chapter = chapters[ci];

                            try {
                                // Pre-fetch page URLs for this chapter
                                let pages = await new Promise(function(resolve, reject) {
                                    chapter.getPages(function(error, data) {
                                        if (error) reject(error);
                                        else resolve(data);
                                    });
                                });

                                // Phase check: bail if paused after getPages
                                if (self._phase !== 'resolving') {
                                    record.downloadStatus = 'failed';
                                    record.downloadError = 'Paused during page pre-fetch';
                                    // Signal other workers to stop by advancing index past end
                                    chapterFetchIndex = chapterRecords.length;
                                    break;
                                }

                                if (pages instanceof Array) {
                                    record.pageUrls = pages;
                                    record.downloadStatus = 'pages-ready'; // page URLs cached, ready to download images
                                } else {
                                    // Anime/video content - skip
                                    record.downloadStatus = 'failed';
                                    record.downloadError = 'Non-image content (video/stream)';
                                }
                            } catch(e) {
                                record.downloadStatus = 'failed';
                                record.downloadError = e.message;
                            }

                            // Cache pageUrls in the non-observable Map for faster access during downloads.
                            // pageUrls are kept on the chapter records as a fallback so that chapter downloads
                            // still work even if entries are evicted from the cache by _trimPageUrlCache().
                            if (record.pageUrls && record.pageUrls.length > 0) {
                                self._pageUrlCache.set(urlItem.url + '::' + record.chapterId, record.pageUrls);
                            }
                        }
                    }

                    // Launch worker pool for concurrent chapter page-fetching
                    let workers = [];
                    for (let w = 0; w < pageConcurrency; w++) {
                        workers.push(fetchChapterPages());
                    }
                    await Promise.all(workers);

                    urlItem.chapters = chapterRecords;
                    urlItem.resolveStatus = 'resolved';

                    // Log success with manga title and chapter count
                    this._log('[IMPORT] OK ' + urlItem.mangaMeta.mangaTitle + ' (' + chapterRecords.length + ' chapters, ' + chapterRecords.filter(function(c) { return c.downloadStatus === 'pages-ready'; }).length + ' with page URLs)');

                    // NOTE: Per-URL IDB save removed to reduce IPC congestion that competes
                    // with onBeforeSendHeaders IPC calls. Batch saves happen at the end of
                    // each batch in _processUrls(). If a crash occurs mid-batch, the
                    // batch's resolved URLs can be recovered via Retry Failed.

                } catch (error) {
                    this._log('[IMPORT] FAIL ' + url + ' -> ' + error.message);
                    urlItem.resolveStatus = 'failed';
                    urlItem.resolveError = error.message;
                }
            }


            // ---- Phase 2: Chapter Downloads (from cached data) ----
            //
            // Uses a manga-level worker pool (concurrent manga downloads) while each manga's
            // chapters are processed sequentially to preserve CBZ ordering.
            // Progress is tracked with an incrementing counter instead of O(n) scans.

            /**
             * Download a single manga's chapters sequentially. Extracted as a separate method
             * so the manga-level worker pool in _processDownloads can call it concurrently.
             * Returns { ok, fail } count for this manga.
             */
            async _downloadOneManga(mangaIndex, mangaRecords) {
                let urlItem = mangaRecords[mangaIndex];
                let meta = urlItem.mangaMeta;
                let self = this;

                let connector = Engine.Connectors.find(function(c) { return c.id === meta.connectorId; });
                if (!connector) {
                    this._log('[IMPORT] Connector not found: ' + meta.connectorId);
                    return { ok: 0, fail: 0 };
                }
                let Manga = this._MangaClass;
                if (!Manga) { this._log('[IMPORT] Manga class not loaded'); return { ok: 0, fail: 0 }; }
                let manga = new Manga(connector, meta.mangaId, meta.mangaTitle);

                if (!urlItem.chapters || urlItem.chapters.length === 0) {
                    return { ok: 0, fail: 0 };
                }

                let localOk = 0;
                let localFail = 0;
                for (let c = 0; c < urlItem.chapters.length && this._phase === 'downloading'; c++) {
                    let chapterRec = urlItem.chapters[c];

                    // Skip already downloaded or failed chapters
                    if (chapterRec.downloadStatus === 'downloaded') { localOk++; continue; }
                    if (chapterRec.downloadStatus === 'failed') { localFail++; continue; }

                    // Get page URLs from the non-observable cache (Map), falling back to the record if needed
                    let pageUrls = this._getPageUrlsForChapter(urlItem, chapterRec);

                    // Handle chapters with missing or empty page URLs.
                    // null/undefined means the data was never fetched (corruption) — mark as failed
                    // so the user can retry resolve to fetch them. Empty array means the chapter
                    // legitimately has zero pages — count as downloaded.
                    if (pageUrls === null || pageUrls === undefined) {
                        chapterRec.downloadStatus = 'failed';
                        chapterRec.downloadError = 'Page URLs missing (data corruption, re-run Resolve & Pre-fetch)';
                        localFail++;
                        this._downloadProgressFail++;
                        continue;
                    }
                    if (pageUrls.length === 0) {
                        chapterRec.downloadStatus = 'downloaded'; // legitimately zero pages
                        localOk++;
                        continue;
                    }

                    chapterRec.downloadStatus = 'downloading';

                    // Create a Chapter object for Engine.Storage.saveChapterPages
                    let ChapterClass = this._ChapterClass;
                    if (!ChapterClass) throw new Error('Chapter class not loaded');
                    let chapter = new ChapterClass(manga, chapterRec.chapterId, chapterRec.title);

                    try {
                        // Download page images using worker pool with AbortController
                        // so Pause instantly stops in-flight network requests
                        let maxConcurrent = this._pageConcurrency || 3;
                        let results = [];
                        let currentIndex = 0;
                        let requestOptions = connector.requestOptions || {};
                        let abortController = new AbortController();
                        let signal = abortController.signal;
                        this._abortControllers.push(abortController);

                        async function worker() {
                            while (currentIndex < pageUrls.length) {
                                if (signal.aborted) {
                                    throw new DOMException('Aborted', 'AbortError');
                                }
                                let pi = currentIndex++;
                                let response = await fetch(pageUrls[pi], Object.assign({}, requestOptions, { signal: signal }));
                                if (!response || signal.aborted) {
                                    throw new DOMException('Aborted', 'AbortError');
                                }
                                if (response.status !== 200) {
                                    throw new Error('Page ' + pageUrls[pi] + ' returned status ' + response.status);
                                }
                                results[pi] = await response.blob();
                            }
                        }

                        let workers = [];
                        for (let w = 0; w < maxConcurrent; w++) {
                            workers.push(worker());
                        }
                        await Promise.all(workers);
                        // Remove controller after successful completion
                        let acIndex = this._abortControllers.indexOf(abortController);
                        if (acIndex >= 0) this._abortControllers.splice(acIndex, 1);

                        // Save to CBZ
                        await Engine.Storage.saveChapterPages(chapter, results);

                        chapterRec.downloadStatus = 'downloaded';
                        localOk++;
                        this._downloadProgressOk++;
                        this._log('[IMPORT]     OK ' + chapter.title + ' saved');

                    } catch (error) {
                        this._log('[IMPORT]     FAIL ' + chapterRec.title + ' failed: ' + error.message);
                        chapterRec.downloadStatus = 'failed';
                        chapterRec.downloadError = error.message;
                        localFail++;
                        this._downloadProgressFail++;
                    }

                    // Evict this chapter's page URLs from the cache now that it's downloaded/failed
                    let evictKey = urlItem.url + '::' + chapterRec.chapterId;
                    this._pageUrlCache.delete(evictKey);
                }

                return { ok: localOk, fail: localFail };
            }

            async _processDownloads() {
                if (this._processing) return;
                this._processing = true;
                let self = this;
                let delay = this._batchDelay;
                let concurrency = this._concurrency;

                // Gather all resolved manga records in order
                let mangaRecords = [];
                for (let i = 0; i < this._urlRecords.length; i++) {
                    if (this._urlRecords[i].resolveStatus === 'resolved') {
                        mangaRecords.push(this._urlRecords[i]);
                    }
                }

                // Pre-compute total chapter count once (from all records) for progress bar
                let totalChapters = 0;
                for (let i = 0; i < this._urlRecords.length; i++) {
                    if (this._urlRecords[i].chapters) {
                        totalChapters += this._urlRecords[i].chapters.length;
                    }
                }

                // Initialize progress counters (cached as instance vars to avoid O(n) scans)
                this._downloadProgressOk = 0;
                this._downloadProgressFail = 0;

                // Count already-downloaded / failed chapters from previous session
                for (let i = 0; i < this._urlRecords.length; i++) {
                    if (this._urlRecords[i].chapters) {
                        for (let c = 0; c < this._urlRecords[i].chapters.length; c++) {
                            let st = this._urlRecords[i].chapters[c].downloadStatus;
                            if (st === 'downloaded') this._downloadProgressOk++;
                            else if (st === 'failed') this._downloadProgressFail++;
                        }
                    }
                }

                // Throttled log: track last log time for manga-level progress
                let lastMangaLogTime = 0;

                this._log('[IMPORT] Starting downloads for ' + mangaRecords.length + ' manga (from cached data, ' + totalChapters + ' total chapters)');

                try {
                    // Manga-level worker pool: process up to `concurrency` manga simultaneously
                    let nextMangaIndex = 0;

                    async function mangaWorker() {
                        while (self._phase === 'downloading') {
                            let m;
                            // Atomically grab the next unprocessed manga index
                            m = nextMangaIndex++;
                            if (m >= mangaRecords.length) break;

                            let urlItem = mangaRecords[m];
                            let meta = urlItem.mangaMeta;
                            let mangaTitle = meta ? meta.mangaTitle : 'unknown';

                            // Log manga start (throttled to avoid flood from concurrent workers)
                            let now = Date.now();
                            if (now - lastMangaLogTime > 1000) {
                                lastMangaLogTime = now;
                                self._log('[IMPORT] Processing manga ' + (m+1) + '/' + mangaRecords.length + ': ' + mangaTitle + ' (' + urlItem.chapters.length + ' chapters)');
                                self.set('_statusText', 'Downloading: ' + mangaTitle + ' (' + (m+1) + '/' + mangaRecords.length + ' manga)');
                            }

                            let result = await self._downloadOneManga(m, mangaRecords);

                            // After manga finishes, save its state to IndexedDB and apply per-manga delay
                            if (self._db) {
                                try {
                                    self._reattachPageUrlsForSave(urlItem);
                                    await self._db.putUrl(urlItem);
                                    self._detachPageUrlsAfterSave(urlItem);
                                } catch(e) {
                                    self._log('[IMPORT] Chapter save error: ' + e.message);
                                }
                            }

                            // Update progress bar using cached counters (O(1) instead of O(n))
                            let totalDone = self._downloadProgressOk + self._downloadProgressFail;
                            let pct = totalChapters > 0 ? Math.round((totalDone / totalChapters) * 100) : 0;
                            self.set('_progressPercent', pct);
                            self.set('_statusText', 'Downloading: ' + mangaTitle + ' (' + totalDone + '/' + totalChapters + ' chapters)');

                            // Throttled display refresh
                            let now2 = Date.now();
                            if (now2 - self._lastRefreshTime > 500) {
                                self._lastRefreshTime = now2;
                                self._refreshDisplayUrls();
                            }

                            // Apply per-manga delay instead of per-chapter delay
                            if (delay > 0 && self._phase === 'downloading') {
                                await new Promise(function(resolve) { setTimeout(resolve, delay); });
                            }
                        }
                    }

                    // Launch the worker pool
                    let workers = [];
                    for (let w = 0; w < concurrency; w++) {
                        workers.push(mangaWorker());
                    }
                    await Promise.all(workers);

                    // Final save - reattach pageUrls from cache for IDB, then detach after
                    if (this._db) {
                        try {
                            for (let ri = 0; ri < this._urlRecords.length; ri++) {
                                self._reattachPageUrlsForSave(this._urlRecords[ri]);
                            }
                            await this._db.putUrls(this._urlRecords);
                            for (let ri = 0; ri < this._urlRecords.length; ri++) {
                                self._detachPageUrlsAfterSave(this._urlRecords[ri]);
                            }
                        } catch(e) {
                            self._log('[IMPORT] Final save error: ' + e.message);
                        }
                    }

                    if (this._phase === 'downloading') {
                        let totalDownloaded = this._downloadProgressOk;
                        let totalFailed = this._downloadProgressFail;
                        this._log('[IMPORT] Downloads finished: ' + totalDownloaded + ' OK, ' + totalFailed + ' failed');
                        if (totalFailed === 0 && totalDownloaded > 0) {
                            this.set('_phase', 'done');
                            this.set('_statusText', 'All downloads finished! (' + totalDownloaded + ' chapters)');
                            this.set('_progressPercent', 100);
                            // Skip _clearSavedState if called from _onDownloadResolvedClick
                            // to preserve unresolved records in the queue
                            if (!this._deferClearState) {
                                await this._clearSavedState();
                            }
                        } else if (totalDownloaded > 0) {
                            this.set('_phase', 'download-paused');
                            this.set('_statusText', 'Partial: ' + totalDownloaded + ' downloaded, ' + totalFailed + ' failed. Resume to retry failed.');
                            await this._saveMeta();
                        } else {
                            this.set('_phase', 'resolve-done');
                            this.set('_statusText', 'All downloads failed. Check and try again.');
                            await this._saveMeta();
                        }
                    }
                } catch (error) {
                    this._log('[IMPORT] Download error: ' + error.message);
                    this.set('_statusText', 'Error: ' + error.message);
                    this.set('_phase', 'download-paused');
                } finally {
                    this._processing = false;
                }
            }

            // ---- Phase 2 Pruned: Chapter download via Engine.Storage ----
            // (uses Engine.Storage.saveChapterPages, requires a Chapter-compatible object)

            /**
             * Minimal Chapter shim for passing to Engine.Storage.saveChapterPages().
             */
        }
        window.customElements.define(HakunekoImportQueue.is, HakunekoImportQueue);
    </script>

</dom-module>
