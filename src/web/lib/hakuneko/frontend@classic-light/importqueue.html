<link rel="import" href="../../polymer/polymer-element.html">
<link rel="import" href="../../polymer/lib/elements/dom-repeat.html">
<link rel="import" href="../../polymer/lib/elements/dom-if.html">
<link rel="import" href="theme.html">

<dom-module id="hakuneko-import-queue">

    <template>
        <style include="theme"></style>
        <style>
            :host {
                display: block;
                background-color: var(--job-control-background-color);
                border-top: var(--manga-control-separator);
                border-bottom: var(--manga-control-separator);
            }
            .header {
                display: flex;
                flex-direction: row;
                padding: 0.25em;
                font-weight: bold;
            }
            .header-title {
                flex: 1;
                padding: 0.25em;
            }
            .header-close {
                flex: 0;
                cursor: pointer;
                padding: 0.25em;
            }
            .header-close:hover {
                opacity: 0.7;
            }
            .progress-bar {
                height: 0.5em;
                background-color: var(--job-list-progress-background-color);
                margin: 0.25em;
                border-radius: 0.25em;
            }
            .progress-fill {
                height: 100%;
                background-color: var(--job-list-progress-color);
                transition: width 0.3s ease;
                border-radius: 0.25em;
            }
            .controls {
                display: flex;
                flex-direction: row;
                padding: 0.25em;
                align-items: center;
                flex-wrap: wrap;
                gap: 0.5em;
            }
            .controls .button {
                cursor: pointer;
                padding: 0.2em 0.5em;
                font-size: 0.9em;
            }
            .controls label {
                font-size: 0.8em;
                display: flex;
                align-items: center;
                gap: 0.25em;
            }
            .controls select {
                font-size: 0.85em;
                padding: 0.1em;
            }
            .status-text {
                flex: 1;
                font-size: 0.85em;
                padding: 0.25em;
                text-align: left;
            }
            .url-list {
                max-height: 12em;
                overflow-y: auto;
                background-color: var(--job-list-background-color);
                font-size: 0.8em;
            }
            .url-item {
                display: flex;
                flex-direction: row;
                padding: 0.15em 0.25em;
                border-bottom: var(--job-list-row-border);
                cursor: default;
            }
            .url-item:hover {
                background-color: var(--manga-list-highlighted);
            }
            .url-item-failed {
                cursor: pointer;
            }
            .url-status-icon {
                flex: 0;
                width: 1.5em;
                text-align: center;
            }
            .url-text {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                padding-left: 0.25em;
            }
            .url-status-text {
                flex: 0;
                width: 5em;
                text-align: right;
                font-size: 0.9em;
            }
            .url-error {
                background-color: var(--manga-list-notification-color);
                padding: 0.5em;
                font-size: 0.9em;
                border-bottom: var(--job-list-row-border);
                white-space: pre-wrap;
                word-break: break-all;
                line-height: 1.4;
            }
            .status-pending,
            .status-pending-text {
                color: var(--job-list-button-queued-color);
            }
            .status-resolving,
            .status-resolving-text {
                color: var(--job-list-button-downloading-color);
            }
            .status-resolved,
            .status-resolved-text {
                color: var(--job-list-button-completed-color);
            }
            .status-failed,
            .status-failed-text {
                color: var(--job-list-button-failed-color);
            }
            .button-disabled {
                opacity: 0.5;
                cursor: not-allowed !important;
            }
            .empty-message {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 1.5em;
                opacity: 0.6;
                font-size: 0.9em;
            }
            .hide {
                display: none;
            }
        </style>

        <div class$="[[ _getVisibilityClass(_visible) ]]">

            <div class="header">
                <span class="header-title">Import Queue Manager</span>
                <span class="header-close" on-click="_onCloseClick" title="Close import queue">✕</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" style$="width: [[ _progressPercent ]]%"></div>
            </div>

            <div class="controls">
                <span class="status-text">[[ _statusText ]]</span>

                <template is="dom-if" if="[[ _showStartButton ]]">
                    <button class="button" on-click="_onStartClick">▶ Start</button>
                </template>

                <template is="dom-if" if="[[ _isRunning ]]">
                    <button class="button" on-click="_onPauseClick">⏸ Pause</button>
                </template>

                <template is="dom-if" if="[[ _showResumeButton ]]">
                    <button class="button" on-click="_onResumeClick">⟳ Resume</button>
                </template>

                <button class="button" on-click="_onResetClick" disabled$="[[ _processing ]]">🔄 Reset</button>

                <label>Concurrency:
                    <select value="{{ _concurrency::change }}">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="5" selected>5</option>
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                    </select>
                </label>

                <label>Delay:
                    <select value="{{ _batchDelay::change }}">
                        <option value="0">0ms</option>
                        <option value="250">250ms</option>
                        <option value="500" selected>500ms</option>
                        <option value="1000">1s</option>
                        <option value="2000">2s</option>
                        <option value="5000">5s</option>
                    </select>
                </label>
            </div>

            <div class="url-list">
                <template is="dom-repeat" items="[[ _urls ]]" initial-count="500" target-framerate="5">
                    <div>
                        <div class$="url-item [[ _getUrlItemClass(item.status) ]]" on-click="_onUrlClick">
                            <span class="url-status-icon">
                                <i class$="fas [[ _getUrlStatusIcon(item.status) ]] [[ _getUrlStatusClass(item.status) ]]"></i>
                            </span>
                            <span class="url-text" title$="[[ item.url ]]">[[ item.url ]]</span>
                            <span class="url-status-text [[ _getUrlStatusClass(item.status) ]]">[[ item.status ]]</span>
                        </div>
                        <div class$="url-error [[ _getErrorVisibility(item, _expandedUrl) ]]">
                            <strong>Error Details:</strong><br>
                            [[ item.error ]]
                        </div>
                    </div>
                </template>
                <template is="dom-if" if="[[ _showEmptyMessage ]]">
                    <div class="empty-message">
                        No URLs loaded. Click "Import URLs" in the toolbar above to load a text file.
                    </div>
                </template>
            </div>

        </div>
    </template>

    <script>
        /** @polymerElement */
        class HakunekoImportQueue extends Polymer.Element {

            static get is() {
                return 'hakuneko-import-queue';
            }

            static get properties() {
                return {
                    _visible: {
                        type: Boolean,
                        value: false
                    },
                    _urls: {
                        type: Array,
                        value: function() { return []; }
                    },
                    _isRunning: {
                        type: Boolean,
                        value: false
                    },
                    _isPaused: {
                        type: Boolean,
                        value: false
                    },
                    _hasSavedState: {
                        type: Boolean,
                        value: false
                    },
                    _concurrency: {
                        type: Number,
                        value: 5
                    },
                    _batchDelay: {
                        type: Number,
                        value: 500
                    },
                    _progressPercent: {
                        type: Number,
                        value: 0
                    },
                    _statusText: {
                        type: String,
                        value: 'Ready'
                    },
                    _expandedUrl: {
                        type: String,
                        value: null
                    },
                    _processedIndex: {
                        type: Number,
                        value: 0
                    },
                    _resolvedMangas: {
                        type: Array,
                        value: function() { return []; }
                    },
                    _processing: {
                        type: Boolean,
                        value: false
                    },
                    _showStartButton: {
                        type: Boolean,
                        computed: '_computeShowStartButton(_isRunning, _hasSavedState, _urls.length, _processing)'
                    },
                    _showResumeButton: {
                        type: Boolean,
                        computed: '_computeShowResumeButton(_hasSavedState, _isRunning, _processing)'
                    },
                    _showEmptyMessage: {
                        type: Boolean,
                        computed: '_computeEmptyMessage(_urls.length, _visible)'
                    }
                };
            }

            ready() {
                super.ready();
                this._electron = require('electron');
                // Get IPC renderer for logging to the terminal (main process)
                this.ipc = require('electron').ipcRenderer;
                // Check for saved/paused state on initialization
                this._checkSavedState();
            }

            // ---- Computed Properties ----

            _computeShowStartButton(isRunning, hasSavedState, urlCount, processing) {
                return !isRunning && !hasSavedState && urlCount > 0 && !processing;
            }

            _computeShowResumeButton(hasSavedState, isRunning, processing) {
                return hasSavedState && !isRunning && !processing;
            }

            _computeEmptyMessage(urlCount, visible) {
                return visible && urlCount === 0;
            }

            // ---- Visibility ----

            _getVisibilityClass(visible) {
                return visible ? '' : 'hide';
            }

            get visible() {
                return this._visible;
            }

            // ---- Terminal Logging Helper ----

            _log(message) {
                try {
                    this.ipc.send('import-log', message);
                } catch(e) {
                    console.log(message);
                }
            }

            // ---- Saved State (Persistence) ----

            _checkSavedState() {
                let self = this;
                self._log('[IMPORT] Checking for saved/paused queue state...');
                Engine.Storage.loadConfig('importqueue')
                    .then(function(data) {
                        if (data && data.urls && data.urls.length > 0) {
                            self.set('_hasSavedState', true);
                            self.set('_urls', data.urls);
                            self.set('_processedIndex', data.lastProcessedIndex || 0);
                            self.set('_concurrency', data.concurrency || 5);
                            self.set('_batchDelay', data.batchDelay || 500);
                            self.set('_progressPercent', Math.round((data.lastProcessedIndex / data.urls.length) * 100));
                            self.set('_statusText', 'Paused queue found: ' + data.urls.length + ' URLs (' + (data.lastProcessedIndex || 0) + ' processed)');
                            self.set('_isPaused', true);
                            self._log('[IMPORT] Found saved queue: ' + data.urls.length + ' URLs, ' + (data.lastProcessedIndex || 0) + ' already processed');
                        } else {
                            self._log('[IMPORT] No saved queue state found');
                        }
                    })
                    .catch(function() {
                        // No saved state - that's fine
                    });
            }

            _saveState() {
                let self = this;
                self._log('[IMPORT] Saving queue state: ' + self._processedIndex + '/' + self._urls.length + ' URLs');
                let urls = self._urls.map(function(u) {
                    return {
                        url: u.url,
                        status: u.status,
                        manga: null, // Don't serialize manga objects
                        error: u.error
                    };
                });

                let state = {
                    urls: urls,
                    concurrency: self._concurrency,
                    batchDelay: self._batchDelay,
                    lastProcessedIndex: self._processedIndex
                };

                Engine.Storage.saveConfig('importqueue', state, 2)
                    .then(function() {
                        self._log('[IMPORT] Queue state saved successfully');
                    })
                    .catch(function(error) {
                        self._log('[IMPORT] Failed to save queue state: ' + error.message);
                    });
            }

            _clearSavedState() {
                this._log('[IMPORT] Clearing saved queue state');
                let state = {
                    urls: [],
                    concurrency: 5,
                    batchDelay: 500,
                    lastProcessedIndex: 0
                };
                Engine.Storage.saveConfig('importqueue', state, 2).catch(function() {});
            }

            // ---- UI Helpers ----

            _getUrlStatusIcon(status) {
                switch(status) {
                    case 'pending':  return 'fa-clock';
                    case 'resolving': return 'fa-spinner fa-pulse';
                    case 'resolved':  return 'fa-check';
                    case 'failed':    return 'fa-exclamation-triangle';
                    default:          return 'fa-circle';
                }
            }

            _getUrlStatusClass(status) {
                switch(status) {
                    case 'pending':   return 'status-pending';
                    case 'resolving': return 'status-resolving';
                    case 'resolved':  return 'status-resolved';
                    case 'failed':    return 'status-failed';
                    default:          return '';
                }
            }

            _getUrlItemClass(status) {
                return status === 'failed' ? 'url-item url-item-failed' : 'url-item';
            }

            _getErrorVisibility(item, expandedUrl) {
                return (item.status === 'failed' && item.error && item.url === expandedUrl) ? '' : 'hide';
            }

            _onUrlClick(e) {
                let item = e.model.item;
                if (item.status === 'failed') {
                    let url = this._expandedUrl === item.url ? null : item.url;
                    this.set('_expandedUrl', url);
                }
            }

            // ---- Public API (called from mangas.html) ----

            async openFilePicker() {
                this._log('[IMPORT] Opening file picker dialog...');
                let self = this;
                let result = await this._electron.remote.dialog.showOpenDialog({
                    title: 'Select URL Import File',
                    properties: ['openFile'],
                    filters: [
                        { name: 'Text Files', extensions: ['txt', 'csv', 'urls'] },
                        { name: 'All Files', extensions: ['*'] }
                    ]
                });

                if (result.canceled || !result.filePaths || result.filePaths.length === 0) {
                    this._log('[IMPORT] File picker cancelled or no file selected');
                    return;
                }
                this._log('[IMPORT] User selected file: ' + result.filePaths[0]);

                // Show the panel immediately with a loading message
                this.set('_visible', true);
                this.set('_statusText', 'Reading file...');
                this.set('_expandedUrl', null);
                this.set('_urls', []);

                // Use setTimeout to let the UI update before doing heavy work
                await new Promise(function(resolve) { setTimeout(resolve, 50); });

                this._log('[IMPORT] Reading file from disk...');
                let fs = require('fs');
                let content = fs.readFileSync(result.filePaths[0], 'utf8');
                this._log('[IMPORT] File read: ' + content.length + ' bytes');

                this.set('_statusText', 'Parsing URLs...');
                await new Promise(function(resolve) { setTimeout(resolve, 50); });

                let lines = content.split(/\r?\n/).filter(function(line) {
                    return line.trim().length > 0;
                });
                this._log('[IMPORT] Found ' + lines.length + ' URLs in file');

                if (lines.length === 0) {
                    this._log('[IMPORT] No URLs found in file, aborting');
                    alert('The selected file contains no URLs.');
                    this.set('_urls', []);
                    this.set('_statusText', 'Ready');
                    return;
                }

                // Reset state with new URLs
                this._log('[IMPORT] Creating ' + lines.length + ' URL objects...');
                this.set('_statusText', 'Creating URL objects (' + lines.length + ')...');

                // Build URL objects in chunks to avoid blocking the UI
                let urlObjects = [];
                const chunkSize = 500;
                for (let i = 0; i < lines.length; i += chunkSize) {
                    let chunk = lines.slice(i, i + chunkSize);
                    for (let j = 0; j < chunk.length; j++) {
                        urlObjects.push({
                            url: chunk[j].trim(),
                            status: 'pending',
                            manga: null,
                            error: null
                        });
                    }
                    // Yield to the event loop every 5000 items to keep UI responsive
                    if (i % 5000 === 0 && i > 0) {
                        this._log('[IMPORT] Yield to event loop at ' + urlObjects.length + ' objects...');
                        await new Promise(function(resolve) { setTimeout(resolve, 10); });
                    }
                }
                this._log('[IMPORT] URL objects created: ' + urlObjects.length);

                this.set('_urls', urlObjects);
                this.set('_processedIndex', 0);
                this.set('_resolvedMangas', []);
                this.set('_progressPercent', 0);
                this.set('_isRunning', false);
                this.set('_isPaused', false);
                this.set('_hasSavedState', false);
                this.set('_statusText', 'Loaded ' + lines.length + ' URLs. Click Start to begin.');
                this._log('[IMPORT] Ready! ' + lines.length + ' URLs loaded, waiting for Start');

                // Remove any saved state since we're starting fresh
                this._clearSavedState();
            }

            // ---- Queue Controls ----

            _onCloseClick() {
                this._log('[IMPORT] Close button clicked');
                if (this._isRunning) {
                    this._log('[IMPORT] Queue is running, prompting pause before close');
                    if (!confirm('Import is in progress. Pause and close?')) {
                        this._log('[IMPORT] User cancelled close');
                        return;
                    }
                    this._pauseQueue();
                }
                this.set('_visible', false);
                this.set('_expandedUrl', null);
                this._log('[IMPORT] Queue panel hidden');
            }

            async _onStartClick() {
                this._log('[IMPORT] ▶ Start button clicked');
                if (this._isRunning || this._processing) {
                    this._log('[IMPORT] Already running or processing, ignoring Start');
                    return;
                }
                this._log('[IMPORT] Starting queue with concurrency=' + this._concurrency + ', delay=' + this._batchDelay + 'ms');
                this.set('_isRunning', true);
                this.set('_isPaused', false);
                this.set('_hasSavedState', false);
                this.set('_expandedUrl', null);
                this._processQueue();
            }

            _onPauseClick() {
                this._log('[IMPORT] ⏸ Pause button clicked');
                if (!this._isRunning) {
                    this._log('[IMPORT] Queue not running, ignoring Pause');
                    return;
                }
                this._pauseQueue();
            }

            _pauseQueue() {
                this._log('[IMPORT] ⏸ Pausing queue at ' + this._processedIndex + '/' + this._urls.length + ' URLs');
                this.set('_isRunning', false);
                this.set('_isPaused', true);
                this.set('_statusText', 'Paused at ' + this._processedIndex + '/' + this._urls.length + ' URLs');
                this._saveState();
            }

            async _onResumeClick() {
                this._log('[IMPORT] ⟳ Resume button clicked');
                if (this._isRunning || this._processing) {
                    this._log('[IMPORT] Already running or processing, ignoring Resume');
                    return;
                }
                this._log('[IMPORT] Resuming queue from ' + this._processedIndex + '/' + this._urls.length);
                this.set('_isRunning', true);
                this.set('_isPaused', false);
                this.set('_hasSavedState', false);
                this.set('_expandedUrl', null);
                this._processQueue();
            }

            _onResetClick() {
                this._log('[IMPORT] 🔄 Reset button clicked');
                if (this._isRunning) {
                    this._log('[IMPORT] Queue is running, prompting confirmation');
                    if (!confirm('Reset will stop the current import. Are you sure?')) {
                        this._log('[IMPORT] User cancelled Reset');
                        return;
                    }
                }
                this._log('[IMPORT] Resetting queue (clearing ' + this._urls.length + ' URLs)');
                this.set('_urls', []);
                this.set('_processedIndex', 0);
                this.set('_resolvedMangas', []);
                this.set('_progressPercent', 0);
                this.set('_isRunning', false);
                this.set('_isPaused', false);
                this.set('_hasSavedState', false);
                this.set('_statusText', 'Ready');
                this.set('_expandedUrl', null);
                this._clearSavedState();
            }

            // ---- Core Queue Processing ----

            async _processQueue() {
                if (this._processing) {
                    this._log('[IMPORT] Already processing, ignoring _processQueue call');
                    return;
                }
                this._log('[IMPORT] ▶ Queue processing started');
                this._processing = true;

                let urls = this._urls;
                let concurrency = this._concurrency;
                let delay = this._batchDelay;
                let self = this;
                let batchCount = 0;

                try {
                    while (this._isRunning && this._processedIndex < urls.length) {
                        // Collect the next batch of pending URLs (up to concurrency)
                        let batch = [];
                        for (let i = this._processedIndex; i < urls.length && batch.length < concurrency; i++) {
                            if (urls[i].status === 'pending') {
                                batch.push({ index: i, urlObj: urls[i] });
                            }
                        }

                        if (batch.length === 0) {
                            // No pending URLs found - check if all done
                            let allDone = true;
                            for (let i = 0; i < urls.length; i++) {
                                if (urls[i].status === 'pending') {
                                    allDone = false;
                                    break;
                                }
                            }
                            if (allDone) {
                                this._log('[IMPORT] All URLs processed, exiting loop');
                                break;
                            }
                            // Otherwise advance processed index
                            this._processedIndex++;
                            continue;
                        }

                        batchCount++;
                        this._log('[IMPORT] Batch ' + batchCount + ': processing URLs ' + batch[0].index + '-' + batch[batch.length-1].index + ' (' + batch.length + ' URLs)');

                        // Mark batch as resolving
                        batch.forEach(function(item) {
                            self.notifyPath('_urls.' + item.index + '.status', 'resolving');
                        });

                        // Process batch concurrently
                        let startTime = Date.now();
                        let promises = batch.map(function(item) {
                            return self._resolveUrl(item.index, item.urlObj.url);
                        });
                        await Promise.all(promises);
                        let elapsed = Date.now() - startTime;
                        this._log('[IMPORT] Batch ' + batchCount + ' completed in ' + elapsed + 'ms');

                        // Update progress
                        let processed = 0;
                        for (let i = 0; i < urls.length; i++) {
                            if (urls[i].status === 'resolved' || urls[i].status === 'failed') {
                                processed++;
                            }
                        }
                        let percent = Math.round((processed / urls.length) * 100);
                        this.set('_progressPercent', percent);
                        this.set('_statusText', 'Processed ' + processed + '/' + urls.length + ' URLs (' + percent + '%)');
                        this.set('_processedIndex', this._processedIndex + batch.length);
                        this._log('[IMPORT] Progress: ' + processed + '/' + urls.length + ' URLs (' + percent + '%) - ' + (urls.length - processed) + ' remaining');

                        // Delay between batches
                        if (delay > 0 && this._isRunning && processed < urls.length) {
                            this._log('[IMPORT] Waiting ' + delay + 'ms before next batch...');
                            await new Promise(function(resolve) { setTimeout(resolve, delay); });
                        }
                    }

                    if (this._isRunning) {
                        this._log('[IMPORT] ✓ All URL resolution complete! Fetching chapters...');
                        // Queue completed - now fetch chapters for all resolved mangas
                        await this._fetchAndDownloadChapters();

                        this.set('_isRunning', false);
                        this.set('_isPaused', false);
                        let failed = 0;
                        let resolved = 0;
                        for (let i = 0; i < urls.length; i++) {
                            if (urls[i].status === 'failed') failed++;
                            if (urls[i].status === 'resolved') resolved++;
                        }
                        this._log('[IMPORT] ✓ Queue fully complete! ' + resolved + ' resolved, ' + failed + ' failed, ' + batchCount + ' batches');
                        this.set('_statusText', 'Complete! ' + resolved + ' resolved, ' + failed + ' failed');
                        this.set('_progressPercent', 100);
                        this._clearSavedState();
                    } else {
                        this._log('[IMPORT] Queue stopped (paused or cancelled) before all URLs processed');
                    }
                } catch (error) {
                    this._log('[IMPORT] Queue processing error: ' + error.message);
                    this.set('_statusText', 'Error: ' + error.message);
                    this.set('_isRunning', false);
                } finally {
                    this._processing = false;
                    this._log('[IMPORT] Queue processor finished');
                }
            }

            async _resolveUrl(index, url) {
                this._log('[IMPORT] Resolving URL ' + index + ': ' + url);
                try {
                    let uri = new URL(url);
                    let connectors = Engine.Connectors.filter(function(connector) {
                        return connector.canHandleURI && connector.canHandleURI(uri);
                    });
                    if (!connectors.length) {
                        connectors = Engine.Connectors.filter(function(connector) {
                            return connector.url && connector.url.includes(uri.hostname);
                        });
                    }
                    if (connectors.length > 1) {
                        let pathname = uri.pathname;
                        connectors = connectors.filter(function(connector) {
                            return pathname.startsWith(new URL(connector.url).pathname);
                        });
                    }
                    if (!connectors.length) {
                        throw new Error('No matching connector found for URL ' + uri.href);
                    }
                    if (connectors.length > 1) {
                        throw new Error('Too many matching connectors found for URL ' + uri.href);
                    }

                    this._log('[IMPORT] Found connector: ' + connectors[0].id + ' for URL: ' + url);
                    let manga = await connectors[0].getMangaFromURI(uri);
                    this._log('[IMPORT] ✓ Resolved: ' + url + ' → ' + manga.title);
                    this.notifyPath('_urls.' + index + '.manga', manga);
                    this.notifyPath('_urls.' + index + '.status', 'resolved');
                    this.push('_resolvedMangas', manga);
                } catch (error) {
                    this._log('[IMPORT] ✗ Failed: ' + url + ' → ' + error.message);
                    this.notifyPath('_urls.' + index + '.status', 'failed');
                    this.notifyPath('_urls.' + index + '.error', error.message);
                }
            }

            async _fetchAndDownloadChapters() {
                let mangas = this._resolvedMangas;
                if (!mangas || mangas.length === 0) {
                    this._log('[IMPORT] No resolved mangas to fetch chapters from');
                    return;
                }

                // Deduplicate manga by their unique identifier
                let uniqueMangas = [];
                let seenIds = {};
                for (let i = 0; i < mangas.length; i++) {
                    let manga = mangas[i];
                    if (!seenIds[manga.id]) {
                        seenIds[manga.id] = true;
                        uniqueMangas.push(manga);
                    }
                }
                this._log('[IMPORT] Fetching chapters for ' + uniqueMangas.length + ' unique manga (from ' + mangas.length + ' total resolves)');

                this.set('_statusText', 'Fetching chapters for ' + uniqueMangas.length + ' unique manga...');

                for (let i = 0; i < uniqueMangas.length; i++) {
                    let manga = uniqueMangas[i];
                    this._log('[IMPORT] Fetching chapters: ' + manga.title + ' (' + (i + 1) + '/' + uniqueMangas.length + ')');
                    this.set('_statusText', 'Fetching chapters: ' + manga.title + ' (' + (i + 1) + '/' + uniqueMangas.length + ')');

                    try {
                        let chapters = await new Promise(function(resolve, reject) {
                            manga.getChapters(function(error, chapters) {
                                if (error) reject(error);
                                else resolve(chapters);
                            });
                        });

                        this._log('[IMPORT]   └─ Got ' + (chapters ? chapters.length : 0) + ' chapters for ' + manga.title);
                        if (chapters && chapters.length > 0) {
                            for (let c = 0; c < chapters.length; c++) {
                                Engine.DownloadManager.addDownload(chapters[c]);
                            }
                        }
                    } catch (error) {
                        this._log('[IMPORT]   └─ Failed to get chapters for ' + manga.title + ':', error.message);
                    }
                }

                this._log('[IMPORT] All chapters fetched and added to download queue');
                this.set('_statusText', 'All chapters added to download queue.');
            }
        }
        window.customElements.define(HakunekoImportQueue.is, HakunekoImportQueue);
    </script>

</dom-module>
